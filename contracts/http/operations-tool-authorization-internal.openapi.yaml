openapi: 3.1.0
info:
  title: Platform Gateway Operations Tool Authorization API
  version: 1.0.0
  description: Exact per-request Owner grant exchange for the trusted Operations Agent workload. Registry grants are signed directly by IAM for the Operations Agent presenter; Energy grants are Gateway-issued with Operations Agent as executingService.
servers:
  - url: https://platform-gateway.internal.invalid
paths:
  /internal/v1/operations/tool-authorization:
    post:
      operationId: authorizeOperationsLogicalTool
      security:
        - operationsAgentMutualTLS: []
      parameters:
        - name: X-Delegation-Grant
          in: header
          required: true
          description: Gateway-signed, Site-scoped Operations service delegation.
          schema:
            type: string
            minLength: 1
            maxLength: 8192
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolAuthorizationRequest'
      responses:
        '200':
          description: Exact grant for the authoritative Owner request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolAuthorizationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    operationsAgentMutualTLS:
      type: mutualTLS
  responses:
    Problem:
      description: Stable fail-closed authorization error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ToolAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [sessionId, runId, request]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 256
        runId:
          type: string
          minLength: 1
          maxLength: 256
        request:
          oneOf:
            - $ref: '#/components/schemas/RegistrySiteRequest'
            - $ref: '#/components/schemas/RegistryAssetRequest'
            - $ref: '#/components/schemas/RegistryAssetModelRequest'
            - $ref: '#/components/schemas/EnergySeriesRequest'
            - $ref: '#/components/schemas/SemanticQueryRequest'
            - $ref: '#/components/schemas/DeviceHistoryAggregateRequest'
    DeviceHistoryAggregateRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      description: Gateway-signed grant for the Telemetry Query Service, presented by the Operations Agent and bound to the exact aggregate query digest.
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: telemetry.history.aggregateDeviceHistory }
        input:
          type: object
          additionalProperties: false
          required: [tenantId, siteId, deviceId, keys, from, to, granularity, timezone, qualityPolicy]
          properties:
            tenantId: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            deviceId: { type: string, format: uuid }
            keys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            granularity: { enum: [QUARTER_HOUR, HOUR, DAY] }
            timezone: { type: string, minLength: 1 }
            qualityPolicy: { const: VALID_ONLY }
    RegistrySiteRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: registry.getSite }
        input:
          $ref: '#/components/schemas/SiteInput'
    RegistryAssetRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: registry.listSiteAssets }
        input:
          $ref: '#/components/schemas/SiteInput'
    RegistryAssetModelRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: registry.getSiteAssetModel }
        input:
          $ref: '#/components/schemas/SiteInput'
    SiteInput:
      type: object
      additionalProperties: false
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }
    EnergySeriesRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: analytics.getEnergySeries }
        input:
          type: object
          additionalProperties: false
          required:
            - tenantId
            - siteId
            - energyType
            - granularity
            - timezone
            - from
            - to
            - qualityPolicy
          properties:
            tenantId: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            energyType: { enum: [electricity, cooling] }
            granularity: { enum: [hour, day, month] }
            timezone: { type: string, minLength: 1 }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            qualityPolicy: { enum: [VALID_ONLY, VALID_AND_SUSPECT] }
            breakdown: { type: string, enum: [device] }
    SemanticQueryRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      description: Gateway-signed Energy grant (analytics.energy-series.read) for the Telemetry Query Service's semantic query, bound to the exact query digest.
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: analytics.semanticQuery }
        input:
          type: object
          additionalProperties: false
          required: [tenantId, siteId, view, measures, granularity, timezone, from, to]
          description: Members are the generated catalog's (libs/analyticsmodel/semantic_catalog.json) of one view; site_id and period_end are never members.
          properties:
            tenantId: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            view: { type: string, minLength: 1 }
            measures: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, minLength: 1 } }
            dimensions: { type: array, maxItems: 2, uniqueItems: true, items: { type: string, minLength: 1 } }
            granularity: { enum: [hour, day, month] }
            timezone: { type: string, minLength: 1 }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
    ToolAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [delegationGrant, policyRevision]
      properties:
        delegationGrant:
          type: string
          minLength: 1
          maxLength: 16384
        policyRevision:
          type: string
          minLength: 1
          maxLength: 256
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
