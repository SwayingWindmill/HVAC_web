openapi: 3.1.0
info:
  title: Platform Gateway Operations Tool Authorization API
  version: 1.0.0
  description: Exact per-request Owner grant exchange for the trusted Operations Agent workload. Registry grants are signed directly by IAM for the Operations Agent presenter; Energy grants are Gateway-issued with Operations Agent as executingService.
servers:
  - url: https://platform-gateway.internal.invalid
paths:
  /internal/v1/operations/tool-authorization:
    post:
      operationId: authorizeOperationsLogicalTool
      security:
        - operationsAgentMutualTLS: []
      parameters:
        - name: X-Delegation-Grant
          in: header
          required: true
          description: Gateway-signed, Site-scoped Operations service delegation.
          schema:
            type: string
            minLength: 1
            maxLength: 8192
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolAuthorizationRequest'
      responses:
        '200':
          description: Exact grant for the authoritative Owner request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolAuthorizationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    operationsAgentMutualTLS:
      type: mutualTLS
  responses:
    Problem:
      description: Stable fail-closed authorization error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ToolAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [investigationId, runId, request]
      properties:
        investigationId:
          type: string
          minLength: 1
          maxLength: 256
        runId:
          type: string
          minLength: 1
          maxLength: 256
        request:
          oneOf:
            - $ref: '#/components/schemas/RegistrySiteRequest'
            - $ref: '#/components/schemas/RegistryEquipmentRequest'
            - $ref: '#/components/schemas/EnergySeriesRequest'
    RegistrySiteRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: registry.getSite }
        input:
          $ref: '#/components/schemas/SiteInput'
    RegistryEquipmentRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: registry.listSiteEquipment }
        input:
          $ref: '#/components/schemas/SiteInput'
    SiteInput:
      type: object
      additionalProperties: false
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }
    EnergySeriesRequest:
      type: object
      additionalProperties: false
      required: [requestId, tool, input]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 256 }
        tool: { const: analytics.getEnergySeries }
        input:
          type: object
          additionalProperties: false
          required:
            - organizationId
            - siteId
            - energyType
            - granularity
            - timezone
            - from
            - to
            - qualityPolicy
          properties:
            organizationId: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            energyType: { const: electricity }
            granularity: { enum: [hour, day, month] }
            timezone: { type: string, minLength: 1 }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            qualityPolicy: { enum: [VALID_ONLY, VALID_AND_SUSPECT] }
    ToolAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [delegationGrant, policyRevision]
      properties:
        delegationGrant:
          type: string
          minLength: 1
          maxLength: 16384
        policyRevision:
          type: string
          minLength: 1
          maxLength: 256
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
