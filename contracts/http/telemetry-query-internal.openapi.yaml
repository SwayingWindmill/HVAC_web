openapi: 3.1.0
info:
  title: HVAC Telemetry Query Internal API
  version: 0.1.0
  description: >-
    Internal, mTLS-protected analytics API used by Platform Gateway and Operations
    Agent. Delegation grants are Gateway-issued, bind the actual mTLS presenter as
    executingService and never authorize arbitrary Cube members or SQL.
servers:
  - url: https://telemetry-query-service:18447
paths:
  /internal/v1/analytics/energy-series:
    post:
      operationId: queryEnergySeries
      summary: Query an authorized site energy time series
      security:
        - workloadMTLS: []
          delegationGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnergySeriesQuery'
      responses:
        '200':
          description: Energy time series with explicit revision, optional authoritative watermarks and quality metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergySeriesResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '405':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/telemetry/device-history:
    post:
      operationId: queryDeviceHistory
      summary: Query bounded accepted numeric Device history with sampled-at Point/Sensor identity
      security:
        - workloadMTLS: []
          delegationGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHistoryQuery'
      responses:
        '200':
          description: Device history whose samples preserve the frozen Registry Point/Sensor binding at sampledAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHistoryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '405':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    workloadMTLS:
      type: mutualTLS
      description: Allowlisted Platform Gateway or Operations Agent workload identity.
    delegationGrant:
      type: apiKey
      in: header
      name: X-Delegation-Grant
      description: Gateway-issued grant whose executingService must equal the mTLS presenter and whose Scope is the normalized query digest.
  responses:
    Problem:
      description: RFC 9457-style problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    EnergySeriesQuery:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - siteId
        - energyType
        - granularity
        - timezone
        - from
        - to
        - qualityPolicy
      properties:
        organizationId:
          type: string
          format: uuid
          description: UUIDv7 organization identifier bound by the delegation grant.
        siteId:
          type: string
          format: uuid
          description: UUIDv7 site identifier bound by the delegation grant.
        energyType:
          type: string
          enum: [electricity]
        granularity:
          type: string
          enum: [hour, day, month]
        timezone:
          type: string
          description: Explicit IANA timezone used for business-period boundaries.
          example: Asia/Shanghai
        from:
          type: string
          format: date-time
          description: Inclusive range start.
        to:
          type: string
          format: date-time
          description: Exclusive range end; minimum range is 1 millisecond and maximum supported range is 366 days.
        qualityPolicy:
          type: string
          enum: [VALID_ONLY, VALID_AND_SUSPECT]
    EnergySeriesPoint:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd, energyKWh]
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        energyKWh:
          type: number
          format: double
    QualitySummary:
      type: object
      additionalProperties: false
      required: [valid, suspect, invalid]
      properties:
        valid:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified VALID.
        suspect:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified SUSPECT.
        invalid:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified INVALID.
    EnergySeriesMetadata:
      type: object
      additionalProperties: false
      required:
        - requestedGranularity
        - actualGranularity
        - datasetRevision
        - partial
        - qualitySummary
      properties:
        requestedGranularity:
          type: string
          enum: [hour, day, month]
        actualGranularity:
          type: string
          enum: [hour, day, month]
        dataWatermark:
          type: string
          format: date-time
        aggregateWatermark:
          type: string
          format: date-time
        datasetRevision:
          type: string
          minLength: 1
        partial:
          type: boolean
        qualitySummary:
          $ref: '#/components/schemas/QualitySummary'
    EnergySeriesResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, points, metadata]
      properties:
        schemaVersion:
          type: integer
          const: 1
        points:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/EnergySeriesPoint'
        metadata:
          $ref: '#/components/schemas/EnergySeriesMetadata'
    DeviceHistoryQuery:
      type: object
      additionalProperties: false
      required: [actingOrganizationId, owningOrganizationId, siteId, deviceId, keys, from, to, maxPointsPerKey]
      properties:
        actingOrganizationId:
          type: string
          format: uuid
          description: Session Acting Organization bound by the delegation grant.
        owningOrganizationId:
          type: string
          format: uuid
          description: IAM-authoritative owner of the Device.
        siteId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        keys:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        from:
          type: string
          format: date-time
          description: Inclusive UTC range start.
        to:
          type: string
          format: date-time
          description: Exclusive UTC range end; maximum range is 24 hours.
        maxPointsPerKey:
          type: integer
          minimum: 1
          maximum: 500
    DeviceHistoryPoint:
      type: object
      additionalProperties: false
      required: [observationId, pointId, sensorId, sampledAt, receivedAt, value, unit, quality, qualityReasons, revision]
      properties:
        observationId:
          type: string
          format: uuid
        pointId:
          type: string
          format: uuid
          description: Registry Telemetry Point identity frozen for this sample at sampledAt.
        sensorId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Registry Sensor identity frozen for this sample at sampledAt, or null for points without a Sensor.
        sampledAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        value:
          type: number
          format: double
        unit:
          type: [string, 'null']
          maxLength: 64
        quality:
          type: string
          enum: [GOOD, SUSPECT]
        qualityReasons:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]+$'
        revision:
          type: integer
          format: int64
          minimum: 0
    DeviceHistorySeries:
      type: object
      additionalProperties: false
      required: [key, points]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        points:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeviceHistoryPoint'
    DeviceHistoryMetadata:
      type: object
      additionalProperties: false
      required: [requestedFrom, requestedTo, dataWatermark, datasetRevision, partial, maxPointsPerKey, returnedPoints, truncatedKeys]
      properties:
        requestedFrom:
          type: string
          format: date-time
        requestedTo:
          type: string
          format: date-time
        dataWatermark:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        datasetRevision:
          type: string
          minLength: 1
          maxLength: 128
        partial:
          type: boolean
        maxPointsPerKey:
          type: integer
          minimum: 1
          maximum: 500
        returnedPoints:
          type: integer
          minimum: 0
          maximum: 4000
        truncatedKeys:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    DeviceHistoryResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, owningOrganizationId, siteId, deviceId, series, metadata]
      properties:
        schemaVersion:
          type: integer
          const: 1
        owningOrganizationId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        series:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/DeviceHistorySeries'
        metadata:
          $ref: '#/components/schemas/DeviceHistoryMetadata'
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, retryable]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        retryable:
          type: boolean
