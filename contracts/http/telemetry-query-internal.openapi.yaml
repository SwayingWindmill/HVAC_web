openapi: 3.1.0
info:
  title: HVAC Telemetry Query Internal API
  version: 0.1.0
  description: >-
    Internal, mTLS-protected analytics API used by Platform Gateway. This contract
    exposes product queries and never accepts arbitrary Cube members or SQL.
servers:
  - url: https://telemetry-query-service:18447
paths:
  /internal/v1/analytics/energy-series:
    post:
      operationId: queryEnergySeries
      summary: Query an authorized site energy time series
      security:
        - workloadMTLS: []
          delegationGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnergySeriesQuery'
      responses:
        '200':
          description: Energy time series with explicit revision, optional authoritative watermarks and quality metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergySeriesResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '405':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    workloadMTLS:
      type: mutualTLS
    delegationGrant:
      type: apiKey
      in: header
      name: X-Delegation-Grant
  responses:
    Problem:
      description: RFC 9457-style problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    EnergySeriesQuery:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - siteId
        - energyType
        - granularity
        - timezone
        - from
        - to
        - qualityPolicy
      properties:
        organizationId:
          type: string
          format: uuid
          description: UUIDv7 organization identifier bound by the delegation grant.
        siteId:
          type: string
          format: uuid
          description: UUIDv7 site identifier bound by the delegation grant.
        energyType:
          type: string
          enum: [electricity]
        granularity:
          type: string
          enum: [hour, day, month]
        timezone:
          type: string
          description: Explicit IANA timezone used for business-period boundaries.
          example: Asia/Shanghai
        from:
          type: string
          format: date-time
          description: Inclusive range start.
        to:
          type: string
          format: date-time
          description: Exclusive range end; minimum range is 1 millisecond and maximum supported range is 366 days.
        qualityPolicy:
          type: string
          enum: [VALID_ONLY, VALID_AND_SUSPECT]
    EnergySeriesPoint:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd, energyKWh]
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        energyKWh:
          type: number
          format: double
    QualitySummary:
      type: object
      additionalProperties: false
      required: [valid, suspect, invalid]
      properties:
        valid:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified VALID.
        suspect:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified SUSPECT.
        invalid:
          type: integer
          format: int64
          description: Count of returned additive interval facts classified INVALID.
    EnergySeriesMetadata:
      type: object
      additionalProperties: false
      required:
        - requestedGranularity
        - actualGranularity
        - datasetRevision
        - partial
        - qualitySummary
      properties:
        requestedGranularity:
          type: string
          enum: [hour, day, month]
        actualGranularity:
          type: string
          enum: [hour, day, month]
        dataWatermark:
          type: string
          format: date-time
        aggregateWatermark:
          type: string
          format: date-time
        datasetRevision:
          type: string
          minLength: 1
        partial:
          type: boolean
        qualitySummary:
          $ref: '#/components/schemas/QualitySummary'
    EnergySeriesResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, points, metadata]
      properties:
        schemaVersion:
          type: integer
          const: 1
        points:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/EnergySeriesPoint'
        metadata:
          $ref: '#/components/schemas/EnergySeriesMetadata'
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, retryable]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        retryable:
          type: boolean
