{
  "openapi": "3.1.0",
  "info": {
    "title": "SE-API-001 Smart Energy Platform Public API",
    "version": "2.1.2",
    "description": "The unique OpenAPI 3.1 machine authority for public /api/v1 HTTP routes. Platform Gateway is the only browser-facing ingress; domain OpenAPI files are subordinate implementation contracts."
  },
  "x-contract-id": "SE-API-001",
  "x-architecture-source": "SE-ARCH-004 V2.1.2",
  "x-runtime-convergence-review": "contracts/architecture/se-api-001-v1.2-runtime-convergence.json",
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/api/v1/gateways/{gatewayId}/credential": {
      "get": {
        "operationId": "getGatewayCredential", "summary": "Read registered Gateway credential status",
        "x-owner": "connectivity", "x-public-ingress": "platform-gateway", "x-architecture-status": "ACTIVE", "x-shape-status": "READY",
        "parameters": [{"name": "gatewayId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/UUIDv7"}}],
        "responses": {"200": {"description": "Credential status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GatewayCredentialStatus"}}}}}
      }
    },
    "/api/v1/gateways/{gatewayId}/enrollment-code": {
      "post": {
        "operationId": "generateGatewayEnrollmentCode", "summary": "Generate one-time 24-hour Gateway enrollment code",
        "x-owner": "connectivity", "x-public-ingress": "platform-gateway", "x-architecture-status": "ACTIVE", "x-shape-status": "READY",
        "parameters": [{"name": "gatewayId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/UUIDv7"}}, {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "Code shown once; only its hash is persisted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GatewayEnrollmentCode"}}}}}
      }
    },
    "/api/v1/gateways/{gatewayId}/revoke": {
      "post": {
        "operationId": "revokeGatewayCredential", "summary": "Terminally revoke this Gateway identity and all overlapping certificates",
        "x-owner": "connectivity", "x-public-ingress": "platform-gateway", "x-architecture-status": "ACTIVE", "x-shape-status": "READY",
        "parameters": [{"name": "gatewayId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/UUIDv7"}}, {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "All credentials and outstanding enrollment codes revoked", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GatewayCredentialStatus"}}}}}
      }
    },
