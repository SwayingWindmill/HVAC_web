          "operator": { "type": "string", "enum": ["EQ", "NE", "GT", "GTE", "LT", "LTE"] },
          "value": { "type": ["number", "string", "boolean"] },
          "minimum": { "type": "number" },
          "maximum": { "type": "number" },
          "direction": { "type": "string", "enum": ["ABOVE", "BELOW"] },
          "trigger": { "type": "number" },
          "reset": { "type": "number" },
          "ageSeconds": { "type": "integer", "minimum": 1 },
