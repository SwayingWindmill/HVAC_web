    "/api/v1/audit/search": {
      "post": {
        "operationId": "searchAudit",
        "summary": "Search the redacted Tenant audit projection",
        "parameters": [
          { "$ref": "#/components/parameters/RequestId" },
          { "$ref": "#/components/parameters/Traceparent" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "actor": { "type": "string", "maxLength": 512 },
                  "action": { "type": "string", "maxLength": 128 },
                  "resourceType": { "type": "string", "maxLength": 128 },
                  "resourceId": { "type": "string", "maxLength": 256 },
                  "outcome": { "type": "string", "maxLength": 64 },
                  "from": { "type": "string", "format": "date-time" },
                  "to": { "type": "string", "format": "date-time" },
                  "limit": { "type": "integer", "minimum": 1, "maximum": 100 }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Redacted Tenant-scoped audit records, newest first.",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AuditSearchResult" } } }
          },
          "401": { "$ref": "#/components/responses/Problem" },
          "403": { "$ref": "#/components/responses/Problem" },
          "default": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
