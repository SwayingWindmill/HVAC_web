{
  "openapi": "3.1.0",
  "info": {
    "title": "HVAC Platform Gateway API",
    "version": "0.1.0",
    "description": "The public HTTP contract owned by platform-gateway. Gateway is the only browser-facing platform service."
  },
  "servers": [{ "url": "/" }],
  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Read platform gateway health",
        "parameters": [
          {
            "name": "includeBuild",
            "in": "query",
            "required": false,
            "schema": { "type": "boolean", "default": false }
          },
          { "$ref": "#/components/parameters/RequestId" },
          { "$ref": "#/components/parameters/Traceparent" }
        ],
        "responses": {
          "200": {
            "description": "Gateway is serving requests.",
            "headers": {
              "X-Request-ID": { "$ref": "#/components/headers/RequestId" },
              "traceparent": { "$ref": "#/components/headers/Traceparent" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HealthResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "405": { "$ref": "#/components/responses/Problem" },
          "default": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
    "/api/v1/version": {
      "get": {
        "operationId": "getVersion",
        "summary": "Read the running gateway build identity",
        "parameters": [
          { "$ref": "#/components/parameters/RequestId" },
          { "$ref": "#/components/parameters/Traceparent" }
        ],
        "responses": {
          "200": {
            "description": "Build identity for the running gateway.",
            "headers": {
              "X-Request-ID": { "$ref": "#/components/headers/RequestId" },
              "traceparent": { "$ref": "#/components/headers/Traceparent" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/BuildInfo" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "405": { "$ref": "#/components/responses/Problem" },
          "default": { "$ref": "#/components/responses/Problem" }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "RequestId": {
        "name": "X-Request-ID",
        "in": "header",
        "required": false,
        "description": "Caller-provided correlation identifier. Invalid values are replaced at the edge.",
        "schema": { "type": "string", "minLength": 1, "maxLength": 128 }
      },
      "Traceparent": {
        "name": "traceparent",
        "in": "header",
        "required": false,
        "description": "W3C Trace Context. Invalid values start a new trace.",
        "schema": { "type": "string" }
      }
    },
    "headers": {
      "RequestId": {
        "description": "Request correlation identifier selected by Gateway.",
        "schema": { "type": "string" }
      },
      "Traceparent": {
        "description": "W3C trace context for the Gateway span.",
        "schema": { "type": "string" }
      }
    },
    "responses": {
      "Problem": {
        "description": "Stable public error representation.",
        "headers": {
          "X-Request-ID": { "$ref": "#/components/headers/RequestId" },
          "traceparent": { "$ref": "#/components/headers/Traceparent" }
        },
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/ProblemDetails" }
          }
        }
      }
    },
    "schemas": {
      "BuildInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": ["service", "version", "commit", "builtAt"],
        "properties": {
          "service": { "type": "string", "const": "platform-gateway" },
          "version": { "type": "string" },
          "commit": { "type": "string" },
          "builtAt": { "type": "string" }
        }
      },
      "HealthResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["status", "service", "checkedAt"],
        "properties": {
          "status": { "type": "string", "const": "ok" },
          "service": { "type": "string", "const": "platform-gateway" },
          "checkedAt": { "type": "string", "format": "date-time" },
          "build": { "$ref": "#/components/schemas/BuildInfo" }
        }
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": ["field", "message"],
        "properties": {
          "field": { "type": "string" },
          "message": { "type": "string" }
        }
      },
      "ProblemDetails": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "title", "status", "detail", "instance", "code", "traceId", "retryable"],
        "properties": {
          "type": { "type": "string", "format": "uri-reference" },
          "title": { "type": "string" },
          "status": { "type": "integer", "minimum": 400, "maximum": 599 },
          "detail": { "type": "string" },
          "instance": { "type": "string" },
          "code": { "type": "string", "pattern": "^[A-Z][A-Z0-9_]+$" },
          "traceId": { "type": "string", "pattern": "^[a-f0-9]{32}$" },
          "retryable": { "type": "boolean" },
          "fieldErrors": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/FieldError" }
          }
        }
      }
    }
  }
}
