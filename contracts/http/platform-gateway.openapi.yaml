                  "additionalProperties": false,
                  "required": ["currentTenantId", "items"],
                  "properties": {
                    "currentTenantId": { "$ref": "#/components/schemas/UUIDv7" },
                    "items": {
                      "type": "array",
                      "maxItems": 100,
                      "items": {
                        "type": "object",
