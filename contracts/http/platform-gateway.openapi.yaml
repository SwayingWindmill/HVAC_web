        "required": ["id", "tenantId", "siteId", "reportingDeviceId", "sensorId", "pointCode", "sourceKey", "displayName", "pointType", "valueType", "unit", "writable", "sampleIntervalMs", "publishIntervalMs", "staleAfterMs", "sourceMetadata", "status", "revision", "createdAt", "updatedAt"],
        "properties": {
          "id": { "$ref": "#/components/schemas/UUIDv7" },
          "tenantId": { "$ref": "#/components/schemas/UUIDv7" },
          "siteId": { "$ref": "#/components/schemas/UUIDv7" },
          "reportingDeviceId": { "$ref": "#/components/schemas/UUIDv7" },
          "sensorId": { "oneOf": [{ "$ref": "#/components/schemas/UUIDv7" }, { "type": "null" }] },
          "pointCode": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[a-z][a-z0-9_]{0,127}$" },
          "sourceKey": { "type": "string", "minLength": 1, "maxLength": 128 },
          "displayName": { "type": "string", "minLength": 1, "maxLength": 256 },
          "pointType": { "type": "string", "enum": ["TELEMETRY", "COUNTER", "STATE", "SETTING", "COMMAND"] },
          "valueType": { "type": "string", "enum": ["BOOLEAN", "NUMBER", "STRING", "JSON"] },
          "unit": { "oneOf": [{ "type": "string", "maxLength": 64 }, { "type": "null" }] },
          "writable": { "type": "boolean" },
          "sampleIntervalMs": { "type": "integer", "minimum": 100, "maximum": 86400000 },
          "publishIntervalMs": { "type": "integer", "minimum": 100, "maximum": 86400000 },
          "staleAfterMs": { "type": "integer", "minimum": 100, "maximum": 604800000 },
          "sourceMetadata": { "type": "object", "additionalProperties": true },
          "status": { "type": "string", "enum": ["ACTIVE", "INACTIVE", "RETIRED"] },
          "revision": { "$ref": "#/components/schemas/Revision" },
          "createdAt": { "$ref": "#/components/schemas/Instant" },
          "updatedAt": { "$ref": "#/components/schemas/Instant" }
        }
      },
      "AssetRelationship": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "tenantId", "siteId", "fromType", "fromId", "toType", "toId", "role", "status", "validFrom", "validTo", "revision", "createdAt", "updatedAt"],
        "properties": {
          "id": { "$ref": "#/components/schemas/UUIDv7" },
          "tenantId": { "$ref": "#/components/schemas/UUIDv7" },
          "siteId": { "$ref": "#/components/schemas/UUIDv7" },
          "fromType": { "type": "string", "enum": ["ASSET", "DEVICE", "SENSOR", "POINT"] },
          "fromId": { "$ref": "#/components/schemas/UUIDv7" },
          "toType": { "type": "string", "enum": ["SITE", "SPACE", "ASSET", "DEVICE", "SENSOR", "POINT"] },
          "toId": { "$ref": "#/components/schemas/UUIDv7" },
          "role": { "type": "string", "minLength": 1, "maxLength": 128 },
          "status": { "type": "string", "enum": ["ACTIVE", "INACTIVE", "RETIRED"] },
          "validFrom": { "$ref": "#/components/schemas/Instant" },
          "validTo": { "oneOf": [{ "$ref": "#/components/schemas/Instant" }, { "type": "null" }] },
          "revision": { "$ref": "#/components/schemas/Revision" },
          "createdAt": { "$ref": "#/components/schemas/Instant" },
          "updatedAt": { "$ref": "#/components/schemas/Instant" }
        }
      },
      "AssetModelCounts": {
        "type": "object",
        "additionalProperties": false,
        "required": ["spaces", "assets", "deviceEndpoints", "physicalSensors", "points"],
        "properties": {
          "spaces": { "type": "integer", "minimum": 0 },
          "assets": { "type": "integer", "minimum": 0 },
          "deviceEndpoints": { "type": "integer", "minimum": 0 },
          "physicalSensors": { "type": "integer", "minimum": 0 },
          "points": { "type": "integer", "minimum": 0 }
        }
      },
      "SiteAssetModel": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "tenantId", "siteId", "spaces", "assets", "devices", "sensors", "telemetryPoints", "relationships", "counts"],
        "properties": {
          "schemaVersion": { "type": "integer", "enum": [2] },
          "tenantId": { "$ref": "#/components/schemas/UUIDv7" },
          "siteId": { "$ref": "#/components/schemas/UUIDv7" },
          "spaces": { "type": "array", "items": { "$ref": "#/components/schemas/Space" } },
          "assets": { "type": "array", "items": { "$ref": "#/components/schemas/Asset" } },
          "devices": { "type": "array", "items": { "$ref": "#/components/schemas/Device" } },
          "sensors": { "type": "array", "items": { "$ref": "#/components/schemas/Sensor" } },
          "telemetryPoints": { "type": "array", "items": { "$ref": "#/components/schemas/TelemetryPoint" } },
          "relationships": { "type": "array", "items": { "$ref": "#/components/schemas/AssetRelationship" } },
          "counts": { "$ref": "#/components/schemas/AssetModelCounts" }
        }
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "ProblemDetails": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "code",
          "traceId",
          "retryable"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          },
          "code": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]+$",
            "x-stable-codes": [
              "RESOURCE_NOT_FOUND",
              "CURSOR_INVALID",
              "REGISTRY_UNAVAILABLE",
              "REGISTRY_TIMEOUT",
              "MAPPING_INVALID",
              "MAPPING_QUARANTINED"
            ]
          },
          "traceId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "retryable": {
            "type": "boolean"
          },
          "fieldErrors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            }
          }
        }
      }
    }
  }
}
