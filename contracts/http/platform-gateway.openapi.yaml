                  "properties": {
                    "tenantId": { "$ref": "#/components/schemas/UUIDv7" },
                    "csrfToken": { "type": "string", "minLength": 32, "maxLength": 256 },
                    "contextRevision": { "type": "integer", "minimum": 1 },
                    "siteContextCleared": { "type": "boolean", "const": true }
