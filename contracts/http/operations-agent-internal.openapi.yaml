openapi: 3.0.3
info:
  title: Operations Agent Internal HTTP API
  version: 1.2.0
  description: Workload-authenticated Coordinator use cases for Site Investigation lists, typed provenance views and reconnect-safe AG-UI recovery batches.
servers:
  - url: https://operations-agent.internal.invalid
paths:
  /internal/v1/sites/{siteId}/operations/investigations:
    get:
      operationId: internalListSiteNightEnergyInvestigations
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
      responses:
        '200': { $ref: '#/components/responses/InvestigationList' }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
    post:
      operationId: internalStartSiteNightEnergyInvestigation
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './operations-investigations-public.openapi.yaml#/components/schemas/EmptyObject' }
      responses:
        '201': { $ref: '#/components/responses/Investigation' }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
  /internal/v1/sites/{siteId}/operations/investigations/{investigationId}:
    get:
      operationId: internalGetSiteNightEnergyInvestigation
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/InvestigationId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
      responses:
        '200': { $ref: '#/components/responses/Investigation' }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
  /internal/v1/sites/{siteId}/operations/investigations/{investigationId}/events:
    get:
      operationId: internalStreamSiteNightEnergyInvestigationEvents
      description: Reauthorizes the delegated request, loads the current committed Investigation view and returns a finite recovery batch. Every response starts with an authoritative snapshot.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/InvestigationId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Finite AG-UI recovery batch projected from the committed Investigation view.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store, no-transform }
            X-Operations-Recovery-Mode:
              schema: { type: string, enum: [FULL_SNAPSHOT, RESUME] }
            X-Operations-Recovery-Reason:
              schema: { type: string, enum: [INITIAL, VALID, UNKNOWN, EXPIRED, CONFLICT] }
            X-Operations-Snapshot-Position:
              schema: { type: string, pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$' }
            X-Operations-Latest-Position:
              schema: { type: string, pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$' }
            X-Operations-Replay-From:
              schema: { type: string, pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$' }
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
  /internal/v1/sites/{siteId}/operations/investigations/{investigationId}:advance:
    post:
      operationId: internalAdvanceSiteNightEnergyInvestigation
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/InvestigationId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './operations-investigations-public.openapi.yaml#/components/schemas/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/Investigation' }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
  /internal/v1/sites/{siteId}/operations/investigations/{investigationId}:cancel:
    post:
      operationId: internalCancelSiteNightEnergyInvestigation
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/InvestigationId'
        - $ref: '#/components/parameters/ActingOrganization'
        - $ref: '#/components/parameters/DelegationGrant'
        - $ref: '#/components/parameters/PolicyRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './operations-investigations-public.openapi.yaml#/components/schemas/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/Investigation' }
        '404': { $ref: '#/components/responses/Nondiscoverable' }
components:
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ActingOrganization:
      name: X-Acting-Organization-ID
      in: header
      required: true
      schema: { type: string }
    DelegationGrant:
      name: X-Delegation-Grant
      in: header
      required: true
      schema: { type: string, maxLength: 8192 }
    PolicyRevision:
      name: X-Route-Policy-Revision
      in: header
      required: true
      schema: { type: string, maxLength: 256 }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last fully applied stable recovery position supplied by Platform Gateway.
      schema:
        type: string
        maxLength: 128
        pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$'
  responses:
    InvestigationList:
      description: Bounded authoritative Site Investigation list.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            $ref: './operations-investigations-public.openapi.yaml#/components/schemas/SiteNightEnergyInvestigationList'
    Investigation:
      description: Authoritative safe Investigation snapshot.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            $ref: './operations-investigations-public.openapi.yaml#/components/schemas/SiteNightEnergyInvestigationView'
    Nondiscoverable:
      description: Resource is absent or outside delegated Scope.
      content:
        application/problem+json:
          schema:
            $ref: './operations-investigations-public.openapi.yaml#/components/schemas/Problem'
