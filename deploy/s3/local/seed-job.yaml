apiVersion: batch/v1
kind: Job
metadata:
  name: command-seed
  namespace: s3-local
  labels:
    app: command-seed
  annotations:
    s3.hvac/local-only: "true"
    s3.hvac/formal-certification: "false"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: command-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: command-seed
          image: hvac-s3-local/command-seed:dev
          imagePullPolicy: Never
          env:
            - { name: S3_LOCAL_DATABASE_URL_FILE, value: /var/run/s3-local/database/command-service-dsn }
            - { name: S3_LOCAL_TENANT_ID, value: 018f3d00-0000-7000-8000-000000000001 }
            - { name: S3_LOCAL_ORGANIZATION_ID, value: 018f3e00-0000-7000-8000-000000000001 }
            - { name: S3_LOCAL_SITE_ID, value: 018f3e00-1000-7000-8000-000000000001 }
            - { name: S3_LOCAL_DEVICE_ID, value: 018f3e00-3000-7000-8000-000000000001 }
            - { name: S3_LOCAL_COMMAND_POINT_ID, value: 018f3e00-4000-7000-8000-000000000001 }
            - { name: S3_LOCAL_VERIFICATION_POINT_KEY, value: zone.temperature_setpoint }
            - { name: S3_LOCAL_SETPOINT_C, value: "24" }
            - { name: S3_LOCAL_IDEMPOTENCY_KEY, value: s3-local-smoke-v1 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: database, mountPath: /var/run/s3-local/database, readOnly: true }
      volumes:
        - name: database
          secret: { secretName: s3-local-database, defaultMode: 288 }
