apiVersion: v1
kind: Service
metadata:
  name: s3-local-web-gateway
  namespace: s3-local
  annotations:
    s3.hvac/access: kubectl-port-forward-only
spec:
  type: ClusterIP
  selector: { app: s3-local-web-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-local-web-gateway
  namespace: s3-local
  annotations:
    s3.hvac/local-only: "true"
    s3.hvac/formal-certification: "false"
    s3.hvac/public-route: port-forward-only
spec:
  replicas: 1
  selector: { matchLabels: { app: s3-local-web-gateway } }
  template:
    metadata: { labels: { app: s3-local-web-gateway } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: s3-local-web-gateway
          image: hvac-s3-local/web-gateway:dev
          imagePullPolicy: Never
          env:
            - { name: S3_LOCAL_WEB_GATEWAY_ADDR, value: ":8080" }
            - { name: S3_LOCAL_WEB_PUBLIC_ORIGIN, value: "http://127.0.0.1:5173" }
            - { name: S3_LOCAL_COMMAND_SERVICE_URL, value: "https://command-service.s3-local.svc.cluster.local:8447" }
            - { name: S3_LOCAL_COMMAND_SERVICE_SERVER_NAME, value: command-service.s3-local.svc.cluster.local }
            - { name: S3_LOCAL_WEB_GATEWAY_TLS_CERT, value: /var/run/s3-local/gateway/tls.crt }
            - { name: S3_LOCAL_WEB_GATEWAY_TLS_KEY, value: /var/run/s3-local/gateway/tls.key }
            - { name: S3_LOCAL_WEB_GATEWAY_SERVER_CA, value: /var/run/s3-local/gateway/ca.crt }
            - { name: S3_LOCAL_WEB_GATEWAY_GRANT_KEY, value: /var/run/s3-local/gateway/command-grant.key }
            - { name: S3_LOCAL_WEB_GATEWAY_DELEGATION_KEY, value: /var/run/s3-local/gateway/command-delegation.key }
            - { name: S3_LOCAL_WEB_GATEWAY_CSRF_FILE, value: /var/run/s3-local/gateway/csrf-token }
            - { name: S3_LOCAL_ORGANIZATION_ID, value: 018f3e00-0000-7000-8000-000000000001 }
            - { name: S3_LOCAL_SITE_ID, value: 018f3e00-1000-7000-8000-000000000001 }
            - { name: S3_LOCAL_DEVICE_ID, value: 018f3e00-3000-7000-8000-000000000001 }
            - { name: S3_LOCAL_DEVICE_CATALOG_FILE, value: /etc/s3/local-devices/device-catalog.json }
            - { name: S3_LOCAL_PRINCIPAL_ID, value: 018f3e00-5000-7000-8000-000000000001 }
            - { name: S3_LOCAL_APPROVER_ID, value: 018f3e00-5000-7000-8000-000000000002 }
            - { name: S3_LOCAL_POLICY_REVISION, value: s3-local-policy-v1 }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: gateway-pki, mountPath: /var/run/s3-local/gateway, readOnly: true }
            - { name: device-catalog, mountPath: /etc/s3/local-devices, readOnly: true }
      volumes:
        - name: device-catalog
          configMap: { name: s3-local-device-catalog }
        - name: gateway-pki
          secret: { secretName: s3-local-web-gateway-pki, defaultMode: 288 }
