apiVersion: batch/v1
kind: Job
metadata:
  name: command-migrator
  namespace: s3-local
  labels:
    app: command-migrator
  annotations:
    s3.hvac/local-only: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: command-migrator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: command-migrator
          image: hvac-s3-local/command-migrator:dev
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: postgres.s3-local.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: hvac_s3
            - name: PGUSER
              value: s3_command_migrator_service
            - name: PGPASSWORD
              value: s3-command-migrator-local-only
            - name: PGSSLMODE
              value: disable
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
