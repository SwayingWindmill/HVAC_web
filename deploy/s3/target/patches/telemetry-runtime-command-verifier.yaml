apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-runtime-service
  namespace: s2-runtime
spec:
  template:
    metadata:
      annotations:
        s3.hvac/template: render-before-apply
        s3.hvac/command-reported-state: exact-approved-cohort-only
    spec:
      containers:
        - name: telemetry-runtime-service
          env:
            - { name: TELEMETRY_ALLOWED_COMMAND_VERIFIER_SPIFFE, value: "spiffe://hvac.local/command-verifier" }
            - { name: TELEMETRY_COMMAND_VERIFIER_ORGANIZATION_ID, value: "[APPROVED_ORGANIZATION_UUIDV7]" }
            - { name: TELEMETRY_COMMAND_VERIFIER_SITE_ID, value: "[APPROVED_SITE_UUIDV7]" }
            - { name: TELEMETRY_COMMAND_VERIFIER_DEVICE_ID, value: "[APPROVED_DEVICE_UUIDV7]" }
