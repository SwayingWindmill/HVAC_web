apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-target-runtime-config
  namespace: s3-certification
immutable: true
data:
  commandPolicyRevision: "[COMMAND_POLICY_REVISION]"
  commandEmergencyRevocationRevision: "[COMMAND_EMERGENCY_REVOCATION_REVISION]"
  thingsBoardBaseURL: "https://thingsboard-control.thingsboard.svc.cluster.local"
  thingsBoardServerName: "thingsboard-control.thingsboard.svc.cluster.local"
  s2ReportedStateURL: "https://telemetry-runtime-service.s2-runtime.svc.cluster.local:8446"
  s2ReportedStateServerName: "telemetry-runtime-service.s2-runtime.svc.cluster.local"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-approved-cohort
  namespace: s3-certification
  annotations:
    s3.hvac/approval-ticket: "[APPROVAL_TICKET_ID]"
    s3.hvac/primary-owner: "[PRIMARY_APPROVER]"
    s3.hvac/secondary-owner: "[SECONDARY_APPROVER]"
    s3.hvac/s2-certification-evidence: "[IMMUTABLE_S2_EVIDENCE_REFERENCE]"
    s3.hvac/provider-mapping-evidence: "[IMMUTABLE_PROVIDER_MAPPING_EVIDENCE_REFERENCE]"
immutable: true
data:
  organizationId: "[APPROVED_ORGANIZATION_UUIDV7]"
  siteId: "[APPROVED_SITE_UUIDV7]"
  deviceId: "[APPROVED_DEVICE_UUIDV7]"
  approved-cohort.json: |
    {
      "schemaVersion": 1,
      "organizationId": "[APPROVED_ORGANIZATION_UUIDV7]",
      "siteId": "[APPROVED_SITE_UUIDV7]",
      "deviceId": "[APPROVED_DEVICE_UUIDV7]",
      "integrationId": "[THINGSBOARD_INTEGRATION_ID]",
      "externalDeviceId": "[THINGSBOARD_EXTERNAL_DEVICE_ID]",
      "bindingRevision": "[IMMUTABLE_BINDING_REVISION]",
      "capability": "SET_TEMPERATURE_SETPOINT",
      "capabilityRevision": "capability:set-temperature-setpoint:v1",
      "mappingRevision": "[IMMUTABLE_MAPPING_REVISION]",
      "mappingStatus": "VERIFIED",
      "providerContract": "THINGSBOARD_CE_4.3.1.3",
      "providerMethod": "setTemperatureSetpoint",
      "reportedStateKey": "zone.temperature_setpoint",
      "timeoutMilliseconds": 7000,
      "maximumSetpointDeltaC": 1,
      "credentialReference": "workload://[PROVIDER]/[CLUSTER]/s3-certification/command-dispatcher"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-command-trust-bundle
  namespace: s3-certification
immutable: true
data:
  command-client-ca.pem: |
    [PEM_COMMAND_CLIENT_CA]
  iam-command-grant.pem: |
    [PEM_IAM_COMMAND_GRANT_CERTIFICATE]
  gateway-delegation.pem: |
    [PEM_GATEWAY_DELEGATION_CERTIFICATE]
  command-service-ca.pem: |
    [PEM_COMMAND_SERVICE_CA]
  telemetry-runtime-ca.pem: |
    [PEM_TELEMETRY_RUNTIME_CA]
  thingsboard-ca.pem: |
    [PEM_THINGSBOARD_CA]
