apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-service
  namespace: s3-certification
  labels: { app: command-service }
  annotations:
    s3.hvac/image-policy: digest-required
    s3.hvac/template: render-before-apply
    s3.hvac/public-route: disabled
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: command-service }
  template:
    metadata:
      labels: { app: command-service, s3.hvac/control-plane: "true" }
    spec:
      serviceAccountName: command-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: command-service } }
      containers:
        - name: command-service
          image: "[SIGNED_IMAGE_COMMAND_SERVICE_DIGEST]"
          imagePullPolicy: IfNotPresent
          env:
            - { name: COMMAND_SERVICE_ADDR, value: ":8447" }
            - { name: COMMAND_DIAGNOSTICS_ADDR, value: ":19087" }
            - { name: COMMAND_DATABASE_URL_FILE, value: /var/run/hvac/database/command-service-dsn }
            - { name: COMMAND_TLS_CERT, value: /var/run/hvac/identity/tls.crt }
            - { name: COMMAND_TLS_KEY, value: /var/run/hvac/identity/tls.key }
            - { name: COMMAND_CLIENT_CA, value: /var/run/hvac/trust/command-client-ca.pem }
            - { name: COMMAND_IAM_GRANT_CERT, value: /var/run/hvac/trust/iam-command-grant.pem }
            - { name: COMMAND_GATEWAY_DELEGATION_CERT, value: /var/run/hvac/trust/gateway-delegation.pem }
            - name: COMMAND_POLICY_REVISION
              valueFrom: { configMapKeyRef: { name: s3-target-runtime-config, key: commandPolicyRevision } }
            - name: COMMAND_EMERGENCY_REVOCATION_REVISION
              valueFrom: { configMapKeyRef: { name: s3-target-runtime-config, key: commandEmergencyRevocationRevision } }
            - name: COMMAND_APPROVED_ORGANIZATION_ID
              valueFrom: { configMapKeyRef: { name: s3-approved-cohort, key: organizationId } }
            - name: COMMAND_APPROVED_SITE_ID
              valueFrom: { configMapKeyRef: { name: s3-approved-cohort, key: siteId } }
            - name: COMMAND_APPROVED_DEVICE_ID
              valueFrom: { configMapKeyRef: { name: s3-approved-cohort, key: deviceId } }
            - name: COMMAND_APPROVED_CAPABILITY
              valueFrom: { configMapKeyRef: { name: s3-approved-cohort, key: capability } }
            - { name: COMMAND_GATEWAY_SPIFFE, value: "spiffe://hvac.local/platform-gateway" }
            - { name: COMMAND_DISPATCHER_SPIFFE, value: "spiffe://hvac.local/command-dispatcher" }
            - { name: COMMAND_VERIFIER_SPIFFE, value: "spiffe://hvac.local/command-verifier" }
            - { name: COMMAND_GRANT_ISSUER, value: "spiffe://hvac.local/iam-service" }
            - { name: COMMAND_GRANT_AUDIENCE, value: command-service }
            - { name: COMMAND_GATEWAY_READ_AUDIENCE, value: command-service }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318" }
          ports:
            - { name: https, containerPort: 8447 }
            - { name: diagnostics, containerPort: 19087 }
          startupProbe: { httpGet: { path: /health/startup, port: diagnostics }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: diagnostics }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: diagnostics }, periodSeconds: 3, timeoutSeconds: 2 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: workload-identity, mountPath: /var/run/hvac/identity, readOnly: true }
            - { name: trust-bundle, mountPath: /var/run/hvac/trust, readOnly: true }
            - { name: database-connection, mountPath: /var/run/hvac/database, readOnly: true }
      volumes:
        - name: workload-identity
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: "[COMMAND_WORKLOAD_ISSUER_NAME]"
              csi.cert-manager.io/issuer-kind: "[COMMAND_WORKLOAD_ISSUER_KIND]"
              csi.cert-manager.io/issuer-group: "[COMMAND_WORKLOAD_ISSUER_GROUP]"
              csi.cert-manager.io/common-name: command-service.s3-certification.svc.cluster.local
              csi.cert-manager.io/dns-names: command-service,command-service.s3-certification,command-service.s3-certification.svc,command-service.s3-certification.svc.cluster.local
              csi.cert-manager.io/uri-sans: spiffe://hvac.local/command-service
              csi.cert-manager.io/key-usages: server auth,client auth
              csi.cert-manager.io/duration: 24h
              csi.cert-manager.io/renew-before: 8h
              csi.cert-manager.io/certificate-file: tls.crt
              csi.cert-manager.io/privatekey-file: tls.key
              csi.cert-manager.io/ca-file: ca.crt
              csi.cert-manager.io/fs-group: "65532"
        - name: trust-bundle
          configMap:
            name: s3-command-trust-bundle
        - name: database-connection
          csi:
            driver: "[SECRETS_STORE_CSI_DRIVER]"
            readOnly: true
            volumeAttributes:
              "[SECRETS_STORE_CLASS_ATTRIBUTE]": s3-command-service-database
