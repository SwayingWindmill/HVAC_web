services:
  energy-api:
    environment:
      OIDC_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/identity
      OIDC_BACKCHANNEL_BASE_URL: http://identity-service:19095
      OIDC_CLIENT_ID: hvac-web-development
      OIDC_REDIRECT_URI: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/api/v1/auth/callback
      IDENTITY_POLICY_REVISION: registry-read:1
      QUERY_CUBE_ENDPOINT: http://cube:4000
    volumes:
      - ${PHASE1_RUNTIME_DIR:-./runtime}/internal-pki:/run/hvac/pki:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/secrets:/run/hvac/secrets:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/tls:/run/hvac/public-tls:ro
      - ../../../contracts/ownership/route-ownership.v1.json:/run/hvac/config/route-ownership.v1.json:ro

  identity-service:
    environment:
      IDENTITY_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/identity
      IDENTITY_CLIENT_ID: hvac-web-development
      IDENTITY_REDIRECT_URI: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/api/v1/auth/callback
      IDENTITY_POST_LOGOUT_REDIRECT_URI: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/?logged_out=1
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:-}

  identity-admin:
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_ADMIN_DATABASE_URL:-}

  identity-reconciler:
    environment:
      IDENTITY_DIRECTORY_DATABASE_URL: ${IDENTITY_DIRECTORY_DATABASE_URL:-}
      IAM_RECONCILER_DATABASE_URL: ${IAM_RECONCILER_DATABASE_URL:-}
      IDENTITY_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:8443}/identity

  telemetry-worker:
    environment:
      ANALYTICS_PROJECTION_ENABLED: "false"
      TELEMETRY_ALARM_CA: /run/hvac/pki/ca.crt
    volumes:
      - ${PHASE1_RUNTIME_DIR:-./runtime}/internal-pki:/run/hvac/pki:ro

  connectivity:
    volumes:
      - ${PHASE1_RUNTIME_DIR:-./runtime}/internal-pki:/run/hvac/pki:ro
    depends_on:
      energy-api:
        condition: service_healthy
      telemetry-worker:
        condition: service_healthy
      mqtt-broker:
        condition: service_started

  centrifugo:
    volumes:
      - ${PHASE1_RUNTIME_DIR:-./runtime}/config/centrifugo.json:/centrifugo/centrifugo.json:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/internal-pki:/run/hvac/pki:ro

  postgres:
    volumes:
      - phase1_wsl_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/backups/postgres/base:/backups/base

  clickhouse:
    volumes:
      - phase1_wsl_clickhouse_data:/var/lib/clickhouse
      - ../../../infra/telemetry/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/backups/clickhouse:/backups

  redis:
    volumes:
      - phase1_wsl_redis_data:/data

  mqtt-broker:
    volumes:
      - ../../../infra/telemetry/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../../infra/telemetry/mqtt/acl:/mosquitto/config/acl:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/mqtt-pki:/mosquitto/certs:ro
      - phase1_wsl_mqtt_data:/mosquitto/data

  node-exporter:
    volumes:
      - /:/host/root:ro

  prometheus:
    # Runtime config and the CA are group-readable by the service group 65532.
    group_add: ["65532"]
    volumes:
      - ${PHASE1_RUNTIME_DIR:-./runtime}/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ${PHASE1_RUNTIME_DIR:-./runtime}/internal-pki/ca.crt:/etc/prometheus/centrifugo-ca.crt:ro

volumes:
  phase1_wsl_postgres_data:
  phase1_wsl_clickhouse_data:
  phase1_wsl_redis_data:
  phase1_wsl_mqtt_data:
