# Default receiver: alerts are grouped and kept in Alertmanager but sent nowhere.
# render-and-run.sh copies this file when the host secrets directory has neither a WeCom webhook
# nor smtp.env. See docs/operations/alerts.md#告警怎么送到人.
route:
  receiver: none
  group_by: [alertname]
  group_wait: 1m
  group_interval: 10m
  repeat_interval: 6h

receivers:
  - name: none
