global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: energy-api
    static_configs:
      - targets: ["energy-api:19080"]

  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:19085"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:19092"]

  - job_name: maintenance
    static_configs:
      - targets: ["maintenance:19093"]

  - job_name: telemetry-worker
    static_configs:
      - targets: ["telemetry-worker:19086"]

  - job_name: metric-worker
    static_configs:
      - targets: ["metric-worker:19090"]

  - job_name: connectivity
    static_configs:
      - targets: ["connectivity:19094"]

  - job_name: forecast-service
    static_configs:
      - targets: ["forecast-service:19099"]

  - job_name: optimization-service
    static_configs:
      - targets: ["optimization-service:19100"]

  - job_name: fdd-service
    static_configs:
      - targets: ["fdd-service:19098"]

  - job_name: mv-service
    static_configs:
      - targets: ["mv-service:19101"]

  - job_name: report-service
    static_configs:
      - targets: ["report-service:19102"]

  - job_name: operations-agent-service
    static_configs:
      - targets: ["operations-agent-service:19095"]

  # Plain internal port. Client port 8000 is TLS-only in production, so a plain scrape
  # there returns HTTP 400 and Centrifugo logs a handshake error every interval.
  - job_name: centrifugo
    metrics_path: /metrics
    static_configs:
      - targets: ["centrifugo:9000"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: clickhouse
    scrape_interval: 30s
    static_configs:
      - targets: ["clickhouse:8123"]

  # Public name of this deployment. Change the host when the certificate name changes.
  - job_name: public-https
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://hvac.swayingwindmill.online/healthz
          - https://hvac.swayingwindmill.online/sign-in
          - https://hvac.swayingwindmill.online/identity/.well-known/openid-configuration
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mqtt
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["mqtt-broker:8883"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
