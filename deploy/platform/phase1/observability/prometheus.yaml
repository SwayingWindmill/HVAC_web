global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: energy-api
    static_configs:
      - targets: ["energy-api:19080"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:19092"]

  - job_name: telemetry-worker
    static_configs:
      - targets: ["telemetry-worker:19086"]

  - job_name: metric-worker
    static_configs:
      - targets: ["metric-worker:19090"]

  - job_name: iot-service
    static_configs:
      - targets: ["iot-service:19094"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: centrifugo
    metrics_path: /metrics
    static_configs:
      - targets: ["centrifugo:8000"]
