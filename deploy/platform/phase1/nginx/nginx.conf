map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream identity_backend {
  zone identity_backend 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  server identity-service:19095 resolve;
}

upstream gateway_backend {
  zone gateway_backend 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  server energy-api:8080 resolve;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/hvac/tls/public.crt;
  ssl_certificate_key /run/hvac/tls/public.key;

  server_tokens off;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location /identity/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_pass http://identity_backend/;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_pass http://gateway_backend;
  }

  location /realtime/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_pass http://gateway_backend;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
