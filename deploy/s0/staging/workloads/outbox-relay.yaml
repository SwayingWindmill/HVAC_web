apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  annotations: { s0.hvac/image-policy: digest-required, s0.hvac/template: render-before-apply }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 1 } }
  selector: { matchLabels: { app: outbox-relay } }
  template:
    metadata: { labels: { app: outbox-relay } }
    spec:
      serviceAccountName: outbox-relay
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: outbox-relay
          image: "[SIGNED_IMAGE_OUTBOX_RELAY]"
          envFrom: "[RUNTIME_BINDINGS_OUTBOX_RELAY]"
          env:
            - { name: OUTBOX_RELAY_DIAGNOSTICS_ADDR, value: ":19081" }
            - { name: OUTBOX_DATABASE_URL, value: "[OUTBOX_DATABASE_URL]" }
            - { name: OUTBOX_RELAY_OWNER, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          ports: [{ name: diagnostics, containerPort: 19081 }]
          startupProbe: { httpGet: { path: /health/startup, port: diagnostics }, failureThreshold: 45, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: diagnostics }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: diagnostics }, periodSeconds: 3, timeoutSeconds: 2 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 512Mi } }
