apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-test-provider
  annotations: { s0.hvac/image-policy: digest-required, s0.hvac/template: render-before-apply }
spec:
  replicas: 1
  selector: { matchLabels: { app: oidc-test-provider } }
  template:
    metadata: { labels: { app: oidc-test-provider } }
    spec:
      serviceAccountName: oidc-test-provider
      terminationGracePeriodSeconds: 15
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: oidc-test-provider
          image: "[SIGNED_IMAGE_OIDC_TEST_PROVIDER]"
          envFrom: "[RUNTIME_BINDINGS_OIDC_TEST_PROVIDER]"
          env:
            - { name: OIDC_FIXTURE_ADDR, value: ":8443" }
            - { name: OIDC_FIXTURE_ISSUER, value: "https://oidc-test-provider:8443" }
            - { name: OIDC_FIXTURE_CLIENT_ID, value: hvac-web-s0-staging }
            - { name: OIDC_FIXTURE_REDIRECT_URI, value: "https://s0-staging.local/api/v1/auth/callback" }
            - { name: OIDC_FIXTURE_TLS_CERT, value: "[WORKLOAD_CERT_PATH]" }
            - { name: OIDC_FIXTURE_TLS_KEY, value: "[WORKLOAD_KEY_PATH]" }
            - { name: OIDC_FIXTURE_DIAGNOSTICS_ADDR, value: ":19084" }
          ports: [{ name: https, containerPort: 8443 }, { name: diagnostics, containerPort: 19084 }]
          startupProbe: { httpGet: { path: /health/startup, port: diagnostics }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: diagnostics }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: diagnostics }, periodSeconds: 3, timeoutSeconds: 2 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: "[RUNTIME_IDENTITY_MOUNTS]"
      volumes: "[RUNTIME_IDENTITY_VOLUMES]"
