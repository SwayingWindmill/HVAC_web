apiVersion: v1
kind: Service
metadata: { name: platform-gateway }
spec:
  selector: { app: platform-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata: { name: iam-service }
spec:
  selector: { app: iam-service }
  ports:
    - { name: https, port: 8444, targetPort: https }
---
apiVersion: v1
kind: Service
metadata: { name: audit-ledger-service }
spec:
  selector: { app: audit-ledger-service }
  ports:
    - { name: https, port: 8446, targetPort: https }
