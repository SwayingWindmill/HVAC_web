apiVersion: v1
kind: Namespace
metadata:
  name: s2-release-certification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s2-route-policy
  namespace: s2-release-certification
data:
  routeRevision: R3
  freshSnapshotRequired: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2-telemetry-rollout-probe
  namespace: s2-release-certification
  labels:
    app.kubernetes.io/name: s2-telemetry-rollout-probe
    app.kubernetes.io/part-of: s2-release-certification
  annotations:
    hvac.local/purpose: rollout-control-plane-fixture
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s2-telemetry-rollout-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s2-telemetry-rollout-probe
      annotations:
        hvac.local/release-revision: v1
        hvac.local/route-revision: R3
        hvac.local/fresh-snapshot-required: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
