<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>HVAC Product IA v2 Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f8; color: #18181b; }
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }
    .sidebar { background: #fff; border-right: 1px solid #e4e4e7; display: flex; flex-direction: column; min-width: 0; }
    .brand { padding: 18px 16px 14px; border-bottom: 1px solid #f0f0f2; }
    .brand-eyebrow { font-size: 11px; color: #71717a; margin-bottom: 4px; }
    .brand-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
    .brand-meta { margin-top: 8px; font-size: 11px; color: #71717a; }
    .nav { padding: 10px; overflow-y: auto; flex: 1; }
    .nav-group + .nav-group { margin-top: 16px; }
    .nav-group-label { padding: 0 8px 6px; font-size: 10px; font-weight: 650; color: #a1a1aa; text-transform: uppercase; letter-spacing: .08em; }
    .nav-item { width: 100%; border: 0; background: transparent; min-height: 38px; padding: 0 9px; border-radius: 7px; display: grid; grid-template-columns: 24px minmax(0,1fr) auto; align-items: center; gap: 7px; color: #3f3f46; cursor: pointer; text-align: left; font: inherit; }
    .nav-item:hover { background: #f4f4f5; color: #18181b; }
    .nav-item.active { background: #f0f0f1; color: #09090b; font-weight: 600; }
    .nav-item.pending { color: #a1a1aa; }
    .nav-number { font-size: 10px; color: #a1a1aa; font-variant-numeric: tabular-nums; }
    .nav-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
    .nav-status { font-size: 9px; padding: 2px 5px; border: 1px solid #e4e4e7; border-radius: 999px; color: #a1a1aa; background: #fff; }
    .sidebar-footer { border-top: 1px solid #f0f0f2; padding: 12px 16px; font-size: 10px; line-height: 1.55; color: #71717a; }
    .content { min-width: 0; display: grid; grid-template-rows: 49px minmax(0,1fr); }
    .topbar { background: rgba(255,255,255,.95); border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .page-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .page-number { font-size: 10px; color: #a1a1aa; }
    .page-name { font-size: 13px; font-weight: 600; }
    .top-status { font-size: 10px; color: #71717a; }
    .viewport { position: relative; min-width: 0; min-height: 0; background: #f7f7f8; }
    iframe { width: 100%; height: 100%; border: 0; background: white; display: block; }
    .pending-surface { height: 100%; display: none; place-items: center; padding: 32px; }
    .pending-card { width: min(620px, 100%); background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 28px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .pending-kicker { font-size: 11px; color: #71717a; }
    .pending-card h2 { margin: 8px 0 8px; font-size: 22px; letter-spacing: -.02em; }
    .pending-card p { margin: 0; color: #71717a; font-size: 13px; line-height: 1.7; }
    .pending-note { margin-top: 18px; padding: 12px; border-radius: 8px; background: #f8f8f9; border: 1px dashed #d4d4d8; font-size: 12px; line-height: 1.65; color: #52525b; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 196px minmax(0,1fr); }
      .nav-status { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-eyebrow">PRODUCT IA v2</div>
      <div class="brand-title">智慧能源 · 全页面预览</div>
      <div class="brand-meta">01–06 已实现 · 07–10 Design Review</div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <div class="nav-group-label">运营</div>
        <button class="nav-item" data-page="overview"><span class="nav-number">01</span><span class="nav-label">运营总览</span></button>
        <button class="nav-item" data-page="operations"><span class="nav-number">02</span><span class="nav-label">系统运行</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">运行管理</div>
        <button class="nav-item" data-page="assets"><span class="nav-number">03</span><span class="nav-label">设备中心</span></button>
        <button class="nav-item" data-page="device-detail"><span class="nav-number">04</span><span class="nav-label">设备详情</span></button>
        <button class="nav-item" data-page="alarms"><span class="nav-number">05</span><span class="nav-label">告警中心</span></button>
        <button class="nav-item" data-page="diagnostics"><span class="nav-number">06</span><span class="nav-label">诊断中心</span></button>
        <button class="nav-item" data-page="work-orders"><span class="nav-number">07</span><span class="nav-label">工单中心</span><span class="nav-status">Review</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">能源优化</div>
        <button class="nav-item" data-page="energy"><span class="nav-number">08</span><span class="nav-label">能源分析</span><span class="nav-status">Review</span></button>
        <button class="nav-item" data-page="efficiency"><span class="nav-number">09</span><span class="nav-label">效率分析</span><span class="nav-status">Review</span></button>
        <button class="nav-item" data-page="opportunities"><span class="nav-number">10</span><span class="nav-label">节能机会</span><span class="nav-status">Review</span></button>
      </div>
    </nav>
    <div class="sidebar-footer">旧 Dashboard / FDD / Forecast / Optimize 等页面不作为本轮设计参考。这里只展示 Product IA v2。</div>
  </aside>
  <section class="content">
    <header class="topbar">
      <div class="page-title"><span id="pageNumber" class="page-number">01</span><span id="pageName" class="page-name">运营总览</span></div>
      <div id="topStatus" class="top-status">已实现 / Browser Reviewed</div>
    </header>
    <main class="viewport">
      <iframe id="previewFrame" title="页面预览" src="/"></iframe>
      <div id="pendingSurface" class="pending-surface">
        <div class="pending-card">
          <div id="pendingKicker" class="pending-kicker"></div>
          <h2 id="pendingTitle"></h2>
          <p>该页面已经进入 Product IA v2，但还没有按新的 Surface Brief 完成实现和浏览器验收。</p>
          <div class="pending-note">不会用旧页面、旧 Ant Design 页面或旧路由页面填充这里。完成后会直接替换为新的正式 Surface。</div>
        </div>
      </div>
    </main>
  </section>
</div>
<script>
  const pages = {
    overview: { number: '01', label: '运营总览', url: '/' },
    operations: { number: '02', label: '系统运行', url: '/?page=operations' },
    assets: { number: '03', label: '设备中心', url: 'http://127.0.0.1:5192/' },
    'device-detail': { number: '04', label: '设备详情', url: 'http://127.0.0.1:5192/?page=device-detail' },
    alarms: { number: '05', label: '告警中心', url: 'http://127.0.0.1:5203/' },
    diagnostics: { number: '06', label: '诊断中心', url: 'http://127.0.0.1:5186/' },
    'work-orders': { number: '07', label: '工单中心', url: 'http://127.0.0.1:5210/?page=work-orders', review: true },
    energy: { number: '08', label: '能源分析', url: 'http://127.0.0.1:5210/?page=energy', review: true },
    efficiency: { number: '09', label: '效率分析', url: 'http://127.0.0.1:5210/?page=efficiency', review: true },
    opportunities: { number: '10', label: '节能机会', url: 'http://127.0.0.1:5210/?page=opportunities', review: true },
  };
  const frame = document.getElementById('previewFrame');
  const pendingSurface = document.getElementById('pendingSurface');
  const pageNumber = document.getElementById('pageNumber');
  const pageName = document.getElementById('pageName');
  const topStatus = document.getElementById('topStatus');
  const pendingKicker = document.getElementById('pendingKicker');
  const pendingTitle = document.getElementById('pendingTitle');

  function selectPage(id) {
    const page = pages[id] || pages.overview;
    history.replaceState(null, '', '/hub.html#' + id);
    document.querySelectorAll('.nav-item').forEach((node) => node.classList.toggle('active', node.dataset.page === id));
    pageNumber.textContent = page.number;
    pageName.textContent = page.label;
    if (page.pending) {
      frame.style.display = 'none';
      pendingSurface.style.display = 'grid';
      pendingKicker.textContent = page.number + ' · ' + page.group;
      pendingTitle.textContent = page.label;
      topStatus.textContent = '待实现 / 不展示旧页面';
    } else {
      pendingSurface.style.display = 'none';
      frame.style.display = 'block';
      frame.src = page.url;
      topStatus.textContent = page.review ? 'Design Review / 尚未接生产数据' : '已实现 / Browser Reviewed';
    }
  }

  document.querySelectorAll('.nav-item').forEach((button) => button.addEventListener('click', () => selectPage(button.dataset.page)));
  selectPage(location.hash.slice(1) || 'overview');
</script>
</body>
</html>
