name: hvac-s3-thingsboard

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - thingsboard-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      TB_SERVICE_ID: hvac-s3-local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TB_QUEUE_TYPE: in-memory
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  thingsboard-postgres-data:
    name: hvac-s3-thingsboard-postgres-data
