services:
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: hvac_operations_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "127.0.0.1:${OPERATIONS_AGENT_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./postgres/init/000-operations-agent-roles.sql:/docker-entrypoint-initdb.d/000-operations-agent-roles.sql:ro
      - ../../services/operations-agent-service/migrations/operations:/migrations/operations:ro
      - ../../services/operations-agent-service/migrations/checkpoints:/migrations/checkpoints:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_operations_agent"]
      interval: 1s
      timeout: 3s
      retries: 60
