services:
  s2-realtime-redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
    networks:
      - s2-realtime-private
    volumes:
      - s2-realtime-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30
    restart: unless-stopped
    labels:
      hvac.data-authority: "false"
      hvac.transport-scope: "s2-only"

  s2-centrifugo:
    image: centrifugo/centrifugo:v6.8.1@sha256:b20c036ed17c7151c6acc176b34870ac37f4eb84618de7cc6459094744dd42aa
    command:
      - /usr/local/bin/centrifugo
      - --config
      - /centrifugo/centrifugo.json
    depends_on:
      s2-realtime-redis:
        condition: service_healthy
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:?required}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CONNECTION_TOKEN_KEY:?required}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?required}
      CENTRIFUGO_VAR_S2_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET:?required}
    networks:
      - s2-realtime-private
      - s2-realtime-ingress
    ports:
      - "127.0.0.1:${CENTRIFUGO_FIXTURE_PORT:-18000}:8000"
    volumes:
      - ./centrifugo.template.json:/centrifugo/centrifugo.json:ro
      - ${CENTRIFUGO_CLIENT_CERT_FILE:?required}:/run/secrets/centrifugo-client/tls.crt:ro
      - ${CENTRIFUGO_CLIENT_KEY_FILE:?required}:/run/secrets/centrifugo-client/tls.key:ro
      - ${TELEMETRY_RUNTIME_CA_FILE:?required}:/run/secrets/telemetry-runtime-ca/ca.crt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 1s
      retries: 30
    restart: unless-stopped
    labels:
      hvac.data-authority: "false"
      hvac.publication-owner: "telemetry-runtime-service"

networks:
  s2-realtime-private:
    internal: true
  s2-realtime-ingress:

volumes:
  s2-realtime-redis-data:
