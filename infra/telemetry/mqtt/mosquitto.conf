listener 8883 0.0.0.0
protocol mqtt
listener_allow_anonymous false

cafile /mosquitto/config/gateway-ca.pem
certfile /mosquitto/config/pki/mqtt-broker-cert.pem
keyfile /mosquitto/config/pki/mqtt-broker-key.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.3

acl_file /mosquitto/config/acl

plugin /usr/lib/mosquitto_hvac_crl.so
plugin_opt_cafile /mosquitto/config/gateway-ca.pem
plugin_opt_crlfile /mosquitto/config/crl/gateway-ca.crl.pem
plugin_opt_control_user mqtt-telemetry-adapter
plugin_opt_poll_seconds 1

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 10000
max_queued_bytes 67108864
message_size_limit 1048576
max_packet_size 1048576

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
