services:
  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ${MQTT_PKI_DIR:?MQTT_PKI_DIR is required}:/mosquitto/config/pki:ro
      - mqtt-broker-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-18883}:8883"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [mqtt]

networks:
  mqtt: {}

volumes:
  mqtt-broker-data: {}
