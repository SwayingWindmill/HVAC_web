services:
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: hvac_s3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    volumes:
      - ./postgres/init/000-bootstrap-identities.sql:/docker-entrypoint-initdb.d/000-bootstrap-identities.sql:ro
      - ../../modules/command/migrations/001_s3_command_runtime.sql:/docker-entrypoint-initdb.d/001_s3_command_runtime.sql:ro
      - ../../modules/command/migrations/002_s3_target_runtime.sql:/docker-entrypoint-initdb.d/002_s3_target_runtime.sql:ro
      - ../../modules/command/migrations/003_s3_tenant_scope.sql:/docker-entrypoint-initdb.d/003_s3_tenant_scope.sql:ro
      - ../../modules/command/migrations/004_s3_command_point_identity.sql:/docker-entrypoint-initdb.d/004_s3_command_point_identity.sql:ro
      - ../../modules/command/migrations/005_s11_edge_execution_evidence.sql:/docker-entrypoint-initdb.d/005_s11_edge_execution_evidence.sql:ro
      - ../../modules/command/migrations/006_command_control_locks_and_sequence_capabilities.sql:/docker-entrypoint-initdb.d/006_command_control_locks_and_sequence_capabilities.sql:ro
      - ../../modules/command/migrations/007_schema_and_table_comments.sql:/docker-entrypoint-initdb.d/007_schema_and_table_comments.sql:ro
      - ../../modules/command/migrations/008_command_precondition_mode.sql:/docker-entrypoint-initdb.d/008_command_precondition_mode.sql:ro
      - ../../modules/command/migrations/command-template-capability-sync.sql:/docker-entrypoint-initdb.d/009_command_template_capability_sync.sql:ro
      - ../../modules/command/migrations/command_intent_trace_context.sql:/docker-entrypoint-initdb.d/010_command_intent_trace_context.sql:ro
      - ../../modules/command/migrations/control-alarm-outbox.sql:/docker-entrypoint-initdb.d/011_control_alarm_outbox.sql:ro
      - ../../modules/command/migrations/command-priority-and-locks.sql:/docker-entrypoint-initdb.d/012_command_priority_and_locks.sql:ro
      - ../../modules/command/migrations/command-audit-immutability.sql:/docker-entrypoint-initdb.d/013_command_audit_immutability.sql:ro
      - ../../modules/command/migrations/command-due-work-tenants.sql:/docker-entrypoint-initdb.d/014_command_due_work_tenants.sql:ro
      - ../../modules/command/migrations/control-alarm-dead-letter-inspect.sql:/docker-entrypoint-initdb.d/015_control_alarm_dead_letter_inspect.sql:ro
    ports:
      - "127.0.0.1:${S3_POSTGRES_HOST_PORT:-57432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_s3"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [s3]

networks:
  s3: {}
