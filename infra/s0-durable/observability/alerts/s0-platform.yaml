groups:
  - name: s0-platform
    rules:
      - alert: S0OutboxStuck
        expr: max(s0_outbox_oldest_age_seconds) > 60
        for: 2m
        labels:
          severity: page
          primary_owner: platform-runtime
          secondary_owner: data-platform
        annotations:
          summary: Outbox publishing is stuck
          runbook: docs/operations/s0-observability.md#outbox-stuck
      - alert: S0AuditIngestionFailing
        expr: increase(s0_audit_ingestion_total{result="error"}[5m]) > 0
        for: 1m
        labels:
          severity: page
          primary_owner: security-platform
          secondary_owner: platform-runtime
        annotations:
          summary: Audit Ledger ingestion is failing
          runbook: docs/operations/s0-observability.md#audit-ingestion-lag
      - alert: S0AuditIngestionLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(s0_audit_ingestion_latency_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: ticket
          primary_owner: security-platform
          secondary_owner: data-platform
        annotations:
          summary: Audit ingestion p95 latency exceeds five seconds
          runbook: docs/operations/s0-observability.md#audit-ingestion-lag
      - alert: S0TelemetryExportFailures
        expr: max(s0_telemetry_failed_exports) > 0
        for: 5m
        labels:
          severity: ticket
          primary_owner: platform-runtime
          secondary_owner: developer-experience
        annotations:
          summary: OTLP exports are failing while business traffic remains available
          runbook: docs/operations/s0-observability.md#collector-unavailable
