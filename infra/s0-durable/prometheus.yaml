global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: s0-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:19080
          - host.docker.internal:19081
          - host.docker.internal:19082
          - host.docker.internal:19083
