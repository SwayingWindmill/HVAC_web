services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: hvac_s0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "${S0_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_s0"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [s0]

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${S0_REDPANDA_HOST_PORT:-19092}
    ports:
      - "${S0_REDPANDA_HOST_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:9092 | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [s0]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${S0_OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "${S0_OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "${S0_OTEL_METRICS_HOST_PORT:-9464}:9464"
      - "${S0_OTEL_HEALTH_HOST_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [s0]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${S0_PROMETHEUS_HOST_PORT:-19090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      otel-collector:
        condition: service_started
    networks: [s0]

networks:
  s0:
    driver: bridge
