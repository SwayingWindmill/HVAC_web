groups:
  - name: phase1-host-resource
    rules:
      - alert: Phase1HostMetricsUnavailable
        expr: up{job="host"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Phase 1 host metrics are unavailable
          description: node-exporter has been unreachable for more than two minutes.
          runbook: docs/operations/alerts.md#主机指标采集中断

      - alert: Phase1HostDiskUsageWarning
        expr: 100 * (1 - node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) > 80 and 100 * (1 - node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) <= 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Phase 1 host disk usage is above 80 percent
          description: "Filesystem {{ $labels.mountpoint }} has exceeded the deployment warning threshold."
          runbook: docs/operations/alerts.md#主机磁盘和-postgresql-的-wal

      - alert: Phase1HostDiskUsageHigh
        expr: 100 * (1 - node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) > 85 and 100 * (1 - node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) <= 90
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 主机磁盘使用率超过 85%
          description: "文件系统 {{ $labels.mountpoint }} 已超过 85%。先腾空间，不要等 90% 的严重告警。"
          runbook: docs/operations/alerts.md#主机磁盘和-postgresql-的-wal

      - alert: Phase1HostDiskUsageCritical
        expr: 100 * (1 - node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Phase 1 host disk usage is above 90 percent
          description: "Filesystem {{ $labels.mountpoint }} has exceeded the deployment critical threshold."
          runbook: docs/operations/alerts.md#主机磁盘和-postgresql-的-wal

      # A deploy writes 1-2 GiB in about 20 minutes (images, build cache, release bundle). A 12 hour
      # window treats that as a step, not a trend, and the 25 percent guard keeps the warning for a
      # disk that is actually getting tight. Steady growth on phase 1 is about 0.15 GiB per day.
      - alert: Phase1HostDiskWillFillWithin24Hours
        expr: predict_linear(node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}[12h], 24 * 60 * 60) < 0 and node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} < 0.25
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Phase 1 host disk is projected to fill within 24 hours
          description: "Filesystem {{ $labels.mountpoint }} has less than 25 percent free and the last 12 hours of growth would exhaust it within 24 hours."
          runbook: docs/operations/alerts.md#主机磁盘和-postgresql-的-wal

      # Something is writing fast enough to fill the disk within hours (runaway log, stuck WAL,
      # backup loop). Six hours of samples still smooth out a single deploy.
      - alert: Phase1HostDiskFillingFast
        expr: predict_linear(node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}[6h], 4 * 60 * 60) < 0 and node_filesystem_avail_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="host",fstype!~"tmpfs|devtmpfs|overlay|squashfs"} < 0.4
        for: 30m
        labels:
          severity: page
        annotations:
          summary: 主机磁盘预计 4 小时内写满
          description: "文件系统 {{ $labels.mountpoint }} 最近 6 小时的增长速度会在 4 小时内写满剩余空间。马上找出正在写盘的进程或容器。"
          runbook: docs/operations/alerts.md#主机磁盘和-postgresql-的-wal

      - alert: Phase1HostMemoryAvailableLow
        expr: node_memory_MemAvailable_bytes{job="host"} < 200 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 主机可用内存低于 200MiB
          description: 这台机器内存很小，容器限额加起来大于物理内存。可用内存连续 15 分钟低于 200MiB 时，先看谁在涨，再考虑临时停掉非业务容器。
          runbook: docs/operations/alerts.md#主机内存和交换分区

      - alert: Phase1HostSwapPressure
        expr: node_memory_SwapTotal_bytes{job="host"} > 0 and (node_memory_SwapTotal_bytes{job="host"} - node_memory_SwapFree_bytes{job="host"}) / node_memory_SwapTotal_bytes{job="host"} > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 交换分区已用超过一半
          description: 交换分区使用超过 50% 持续 15 分钟，说明物理内存已经不够用。
          runbook: docs/operations/alerts.md#主机内存和交换分区
