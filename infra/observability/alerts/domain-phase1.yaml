groups:
  - name: mqtt-edge-phase1
    interval: 30s
    rules:
      - alert: EdgeMQTTPublisherDisconnected
        expr: max(hvac_edge_mqtt_connected) == 0
        for: 2m
        labels:
          severity: page
          primary_owner: edge-platform
          secondary_owner: connector-platform
        annotations:
          summary: Edge MQTT publisher is disconnected from the broker
          runbook: docs/operations/alerts.md#网关的-mqtt-断开
      - alert: EdgeStoreForwardQueueHigh
        expr: max(hvac_edge_mqtt_queue_utilization_ratio) > 0.8
        for: 5m
        labels:
          severity: page
          primary_owner: edge-platform
          secondary_owner: connector-platform
        annotations:
          summary: Edge Store and Forward queue is above 80 percent capacity
          runbook: docs/operations/alerts.md#网关的待发队列过高
      - alert: EdgeStoreForwardQueueRejected
        expr: sum(rate(hvac_edge_mqtt_queue_limit_rejections_total[5m])) > 0
        for: 2m
        labels:
          severity: page
          primary_owner: edge-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: Edge MQTT publishes are being rejected because the persistent queue is full
          runbook: docs/operations/alerts.md#网关的待发队列过高
      - alert: MQTTTelemetryAdapterDisconnected
        expr: max(hvac_mqtt_connected) == 0
        for: 2m
        labels:
          severity: page
          primary_owner: connector-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: MQTT telemetry adapter is disconnected from the broker
          runbook: docs/operations/alerts.md#接入服务的-mqtt-断开
      - alert: MQTTProcessingQueueHigh
        expr: max(hvac_mqtt_processing_queue_depth) / max(hvac_mqtt_processing_queue_capacity) > 0.8 and max(hvac_mqtt_processing_queue_capacity) > 0
        for: 5m
        labels:
          severity: page
          primary_owner: connector-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: MQTT processing queue is above 80 percent capacity
          runbook: docs/operations/alerts.md#接入服务的处理队列过高
      - alert: MQTTTelemetryDropped
        expr: sum(rate(hvac_mqtt_messages_processed_total{outcome="dropped"}[5m])) > 0
        for: 2m
        labels:
          severity: page
          primary_owner: connector-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: MQTT telemetry poison messages are being dropped
          runbook: docs/operations/alerts.md#接入服务丢弃消息
      - alert: MQTTDownstreamRetrying
        expr: sum(rate(hvac_mqtt_message_retries_total[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          primary_owner: telemetry-platform
          secondary_owner: connector-platform
        annotations:
          summary: MQTT adapter is retrying downstream S2 delivery
          runbook: docs/operations/alerts.md#接入服务反复重试

  - name: command-control-phase1
    interval: 30s
    rules:
      - alert: CommandVerificationFailureRateHigh
        expr: (sum(rate(hvac_command_verifications_total{outcome!="verified"}[10m])) / sum(rate(hvac_command_verifications_total[10m]))) > 0.05 and sum(increase(hvac_command_verifications_total[10m])) > 20
        for: 10m
        labels:
          severity: page
          primary_owner: control-platform
          secondary_owner: platform-operations
        annotations:
          summary: More than 5 percent of command verifications are not VERIFIED
          runbook: docs/operations/alerts.md#指令核对失败
      - alert: CommandVerificationTimeoutRateHigh
        expr: (sum(rate(hvac_command_verifications_total{outcome="timed_out"}[10m])) / sum(rate(hvac_command_verifications_total[10m]))) > 0.02 and sum(increase(hvac_command_verifications_total[10m])) > 50
        for: 10m
        labels:
          severity: page
          primary_owner: control-platform
          secondary_owner: connector-platform
        annotations:
          summary: Command verification timeout rate is above 2 percent
          runbook: docs/operations/alerts.md#指令核对超时
      - alert: CommandAPI5xxHigh
        expr: (sum(rate(hvac_command_http_requests_total{status_class="5xx"}[5m])) / sum(rate(hvac_command_http_requests_total[5m]))) > 0.01 and sum(increase(hvac_command_http_requests_total[5m])) > 50
        for: 5m
        labels:
          severity: page
          primary_owner: control-platform
          secondary_owner: platform-operations
        annotations:
          summary: Command API 5xx rate is above 1 percent
          runbook: docs/operations/alerts.md#指令接口出错

  - name: alarm-phase1
    interval: 30s
    rules:
      - alert: AlarmAPI5xxHigh
        expr: (sum(rate(hvac_alarm_http_requests_total{status_class="5xx"}[5m])) / sum(rate(hvac_alarm_http_requests_total[5m]))) > 0.01 and sum(increase(hvac_alarm_http_requests_total[5m])) > 50
        for: 5m
        labels:
          severity: page
          primary_owner: alarm-platform
          secondary_owner: platform-operations
        annotations:
          summary: Alarm API 5xx rate is above 1 percent
          runbook: docs/operations/alerts.md#告警接口出错
      - alert: AlarmMutationRejectionRateHigh
        expr: (sum(rate(hvac_alarm_http_requests_total{method="POST",status_class="4xx"}[10m])) / sum(rate(hvac_alarm_http_requests_total{method="POST"}[10m]))) > 0.2 and sum(increase(hvac_alarm_http_requests_total{method="POST"}[10m])) > 10
        for: 10m
        labels:
          severity: ticket
          primary_owner: alarm-platform
          secondary_owner: platform-security
        annotations:
          summary: Alarm lifecycle mutation rejection rate is above 20 percent
          runbook: docs/operations/alerts.md#告警操作被拒绝
