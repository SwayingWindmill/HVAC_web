groups:
  - name: s2-telemetry-security
    interval: 30s
    rules:
      - alert: S2SecurityZeroInvariantViolation
        expr: sum(hvac_s2_security_zero_invariant_total) > 0
        for: 0m
        labels:
          severity: critical
          primary_owner: platform-security
          secondary_owner: telemetry-platform
        annotations:
          summary: S2 security zero invariant is non-zero
          runbook: docs/operations/alerts.md#安全计数不为零
      - alert: S2RequestFallbackDetected
        expr: sum(hvac_s2_security_zero_invariant_total{invariant="request_fallback"}) > 0
        for: 0m
        labels:
          severity: critical
          primary_owner: platform-security
          secondary_owner: gateway-platform
        annotations:
          summary: Legacy or Mock request-level fallback was detected
          runbook: docs/operations/alerts.md#安全计数不为零
      - alert: S2PostRevocationDelivery
        expr: sum(hvac_s2_revocation_events_total{phase="post_revocation",outcome!="blocked"}) > 0
        for: 0m
        labels:
          severity: critical
          primary_owner: platform-security
          secondary_owner: realtime-platform
        annotations:
          summary: Delivery occurred after revocation
          runbook: docs/operations/alerts.md#撤销授权后仍有推送
  - name: s2-telemetry-slo
    interval: 30s
    rules:
      - alert: S2SnapshotErrorBudgetBurn
        expr: (sum(rate(hvac_s2_snapshot_requests_total{outcome!="success"}[5m])) / sum(rate(hvac_s2_snapshot_requests_total[5m]))) > 0.01 and sum(increase(hvac_s2_snapshot_requests_total[5m])) > 50
        for: 5m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: gateway-platform
        annotations:
          summary: Snapshot errors are burning the S2 error budget
          runbook: docs/operations/alerts.md#快照接口出错
      - alert: S2SnapshotAgeHigh
        expr: max(hvac_s2_snapshot_age_seconds) > 180
        for: 5m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: platform-operations
        annotations:
          summary: Authoritative Snapshot age exceeds the release envelope
          runbook: docs/operations/alerts.md#快照数据过旧
      - alert: S2IngestSourceLagHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(hvac_s2_source_lag_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: connector-platform
        annotations:
          summary: Source ingest lag is high
          runbook: docs/operations/alerts.md#读数接收延迟
      - alert: S2DataGoodRateLow
        expr: (sum(rate(hvac_s2_data_quality_records_total{quality="good"}[10m])) / sum(rate(hvac_s2_data_quality_records_total[10m]))) < 0.95 and sum(increase(hvac_s2_data_quality_records_total[10m])) > 100
        for: 10m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: energy-data
        annotations:
          summary: Telemetry data good rate is below 95 percent
          runbook: docs/operations/alerts.md#读数合格率低
      - alert: S2OutboxLagHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(hvac_s2_outbox_lag_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: page
          primary_owner: realtime-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: Telemetry outbox lag is high
          runbook: docs/operations/alerts.md#推送待发队列延迟
      - alert: S2PublicationLagHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(hvac_s2_publication_lag_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: page
          primary_owner: realtime-platform
          secondary_owner: telemetry-platform
        annotations:
          summary: Realtime publication lag is high
          runbook: docs/operations/alerts.md#推送延迟
      - alert: S2PresenceLate
        expr: histogram_quantile(0.99, sum by (le) (rate(hvac_s2_presence_lateness_seconds_bucket[5m]))) > 60
        for: 5m
        labels:
          severity: ticket
          primary_owner: telemetry-platform
          secondary_owner: platform-operations
        annotations:
          summary: Presence evaluation is late
          runbook: docs/operations/alerts.md#在线状态判断延迟
      - alert: S2RecoveryFailureRateHigh
        expr: (sum(rate(hvac_s2_recovery_attempts_total{outcome!="success"}[5m])) / sum(rate(hvac_s2_recovery_attempts_total[5m]))) > 0.005 and sum(increase(hvac_s2_recovery_attempts_total[5m])) > 20
        for: 5m
        labels:
          severity: page
          primary_owner: realtime-platform
          secondary_owner: frontend-platform
        annotations:
          summary: Recovery or Snapshot fallback failures are high
          runbook: docs/operations/alerts.md#断线补发失败
      - alert: S2SubscriptionFailure
        expr: sum(rate(hvac_s2_subscription_events_total{outcome!="success"}[5m])) > 0
        for: 2m
        labels:
          severity: ticket
          primary_owner: realtime-platform
          secondary_owner: platform-security
        annotations:
          summary: Subscription operations are failing
          runbook: docs/operations/alerts.md#订阅失败
      - alert: S2SlowConsumerDisconnects
        expr: sum(rate(hvac_s2_slow_consumer_disconnects_total[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          primary_owner: realtime-platform
          secondary_owner: platform-operations
        annotations:
          summary: Slow consumers are being disconnected
          runbook: docs/operations/alerts.md#页面接收太慢被断开
  - name: s2-telemetry-dependencies
    interval: 30s
    rules:
      - alert: S2RedisUnavailable
        expr: sum(rate(hvac_s2_upstream_requests_total{dependency="redis",outcome!="success"}[5m])) > 0
        for: 2m
        labels:
          severity: page
          primary_owner: realtime-platform
          secondary_owner: platform-operations
        annotations:
          summary: Redis dependency is failing
          runbook: docs/operations/alerts.md#redis-不可用
      - alert: S2PostgresUnavailable
        expr: sum(rate(hvac_s2_upstream_requests_total{dependency="postgres",outcome!="success"}[5m])) > 0
        for: 2m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: database-platform
        annotations:
          summary: PostgreSQL dependency is failing
          runbook: docs/operations/alerts.md#postgresql-不可用
      - alert: S2UpstreamUnavailable
        expr: sum(rate(hvac_s2_upstream_requests_total{outcome!="success"}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          primary_owner: telemetry-platform
          secondary_owner: connector-platform
        annotations:
          summary: S2 upstream dependency is failing
          runbook: docs/operations/alerts.md#上游数据源不可用
      - alert: S2ExporterFailure
        expr: sum(rate(hvac_s2_exporter_events_total{outcome=~"failed|dropped"}[5m])) > 0
        for: 2m
        labels:
          severity: ticket
          primary_owner: platform-observability
          secondary_owner: platform-operations
        annotations:
          summary: Observability exporter is failing or dropping signals
          runbook: docs/operations/alerts.md#指标导出失败
  - name: platform-data-freshness
    interval: 1m
    rules:
      - alert: AnalyticsEnergyProjectionFailing
        expr: sum(increase(hvac_analytics_projection_failures_total[10m])) > 0
        for: 15m
        labels:
          severity: page
          primary_owner: energy-platform
          secondary_owner: platform-operations
        annotations:
          summary: Energy projection keeps failing, so energy pages stop at the last projected interval
          runbook: docs/operations/alerts.md#用电量计算停住
      - alert: TelemetryIngestStopped
        expr: (sum(rate(hvac_s2_ingest_records_total{outcome="success"}[15m])) or vector(0)) == 0
        for: 15m
        labels:
          severity: page
          primary_owner: telemetry-platform
          secondary_owner: platform-operations
        annotations:
          summary: No telemetry accepted for 15 minutes; gateways, the broker or connectivity are down
          runbook: docs/operations/alerts.md#收不到任何读数
