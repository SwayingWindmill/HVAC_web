services:
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: hvac_s3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    volumes:
      - ./postgres/init/000-bootstrap-identities.sql:/docker-entrypoint-initdb.d/000-bootstrap-identities.sql:ro
      - ../../services/command-service/migrations/001_s3_command_runtime.sql:/docker-entrypoint-initdb.d/001_s3_command_runtime.sql:ro
      - ../../services/command-service/migrations/002_s3_target_runtime.sql:/docker-entrypoint-initdb.d/002_s3_target_runtime.sql:ro
      - ../../services/command-service/migrations/003_s3_tenant_scope.sql:/docker-entrypoint-initdb.d/003_s3_tenant_scope.sql:ro
      - ../../services/command-service/migrations/004_s3_command_point_identity.sql:/docker-entrypoint-initdb.d/004_s3_command_point_identity.sql:ro
      - ../../services/command-service/migrations/005_s11_edge_execution_evidence.sql:/docker-entrypoint-initdb.d/005_s11_edge_execution_evidence.sql:ro
    ports:
      - "127.0.0.1:${S3_POSTGRES_HOST_PORT:-57432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_s3"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [s3]

networks:
  s3: {}
