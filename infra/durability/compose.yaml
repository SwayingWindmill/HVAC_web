services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: hvac_s0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "${S0_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_s0"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [s0]

networks:
  s0:
    driver: bridge
