services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: hvac_s0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - "${S0_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hvac_s0"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [s0]

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${S0_REDPANDA_HOST_PORT:-19092}
    ports:
      - "${S0_REDPANDA_HOST_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:9092 | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [s0]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - "${S0_TOXIPROXY_API_HOST_PORT:-18474}:8474"
      - "${S0_TOXIPROXY_POSTGRES_HOST_PORT:-15432}:15432"
    networks: [s0]

networks:
  s0:
    driver: bridge
