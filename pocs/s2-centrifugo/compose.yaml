services:
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    platform: linux/amd64
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [poc]

  owner:
    image: node:20.19.4-bookworm-slim@sha256:a25e59a5562406b0a4f34ce94ccad6c3902dcf3269b40e1fe12d881090c6f9be
    platform: linux/amd64
    command: ["node", "/poc/owner.mjs"]
    environment:
      PORT: "18081"
    volumes:
      - ./owner.mjs:/poc/owner.mjs:ro
    ports:
      - "${POC_S2_OWNER_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks: [poc]

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1@sha256:b20c036ed17c7151c6acc176b34870ac37f4eb84618de7cc6459094744dd42aa
    platform: linux/amd64
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${POC_CENTRIFUGO_HMAC_SECRET:?POC_CENTRIFUGO_HMAC_SECRET is required}
      CENTRIFUGO_HTTP_API_KEY: ${POC_CENTRIFUGO_API_KEY:?POC_CENTRIFUGO_API_KEY is required}
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "${POC_S2_CENTRIFUGO_PORT:-18000}:8000"
    depends_on:
      owner:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "centrifugo", "checkconfig", "-c", "/centrifugo/config.json"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [poc]

networks:
  poc:
    driver: bridge
