services:
  postgres:
    image: postgres:16.4-bookworm@sha256:9a70e4d1c03a5066080292db2dd95ee3965d3651316e21989fa0935afb8ce8ca
    platform: linux/amd64
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: legacy_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POC_POSTGRES_PASSWORD:?POC_POSTGRES_PASSWORD is required}
    ports:
      - "${POC_POSTGRES_PORT:-56432}:5432"
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-poc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacy_poc"]
      interval: 2s
      timeout: 3s
      retries: 40
    networks: [poc]

  redpanda:
    image: redpandadata/redpanda:v24.2.18@sha256:59a5a91630e1e71abb4c96f363436ce4b76631c079bd50967249509941d78177
    platform: linux/amd64
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:9092 | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 40
    networks: [poc]

  debezium:
    image: quay.io/debezium/connect:3.6.0.Final@sha256:698f0559e667a242f962221079e75917b2b7a3ad4de62661e977628da0e33b45
    platform: linux/amd64
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: platform-component-poc
      CONFIG_STORAGE_TOPIC: poc-connect-configs
      OFFSET_STORAGE_TOPIC: poc-connect-offsets
      STATUS_STORAGE_TOPIC: poc-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "${POC_DEBEZIUM_PORT:-18083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/connectors >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [poc]

  evidence-sink:
    image: node:20.19.4-bookworm-slim@sha256:a25e59a5562406b0a4f34ce94ccad6c3902dcf3269b40e1fe12d881090c6f9be
    platform: linux/amd64
    command: ["node", "/poc/evidence-sink.mjs"]
    environment:
      PORT: "18080"
    volumes:
      - ./evidence-sink.mjs:/poc/evidence-sink.mjs:ro
    ports:
      - "${POC_EVIDENCE_SINK_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [poc]

  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect:4.94.0@sha256:21cb685b4245d4e37b60dcb6eafa77aa05c3daefbbe656ed9da19500687f808d
    platform: linux/amd64
    command: ["run", "/poc/redpanda-connect.yaml"]
    volumes:
      - ./redpanda-connect.yaml:/poc/redpanda-connect.yaml:ro
    ports:
      - "${POC_REDPANDA_CONNECT_PORT:-14195}:4195"
    depends_on:
      redpanda:
        condition: service_healthy
      evidence-sink:
        condition: service_healthy
    networks: [poc]

  centrifugo:
    image: centrifugo/centrifugo:v6.8.1@sha256:b20c036ed17c7151c6acc176b34870ac37f4eb84618de7cc6459094744dd42aa
    platform: linux/amd64
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${POC_CENTRIFUGO_HMAC_SECRET:?POC_CENTRIFUGO_HMAC_SECRET is required}
      CENTRIFUGO_HTTP_API_KEY: ${POC_CENTRIFUGO_API_KEY:?POC_CENTRIFUGO_API_KEY is required}
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    ports:
      - "${POC_CENTRIFUGO_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "centrifugo", "checkconfig", "-c", "/centrifugo/config.json"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [poc]

networks:
  poc:
    driver: bridge
