name: S3 Command Certification

on:
  pull_request:
    paths:
      - '.github/workflows/s3-command-certification.yml'
      - 'scripts/check-s3-workflow-topology.mjs'
      - 'contracts/ownership/**'
      - 'contracts/thingsboard/**'
      - 'deploy/s0/images/go-service.Dockerfile'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'libs/workloadtls/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/telemetry-runtime-service/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-certification.mjs'
      - 'scripts/check-s3-target-runtime.mjs'
      - 'scripts/run-s3-command-certification.mjs'
      - 'scripts/run-s3-target-runtime-tests.mjs'
      - 'scripts/test-s3-command-certification.mjs'
      - 'scripts/test-s3-target-image-evidence.mjs'
      - 'scripts/write-s3-target-image-evidence.mjs'
      - 'scripts/aggregate-s3-target-image-evidence.mjs'
      - 'scripts/verify-s3-command-certification.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    tags: ['s3-v*']
    paths:
      - '.github/workflows/s3-command-certification.yml'
      - 'scripts/check-s3-workflow-topology.mjs'
      - 'contracts/ownership/**'
      - 'contracts/thingsboard/**'
      - 'deploy/s0/images/go-service.Dockerfile'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'libs/workloadtls/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/telemetry-runtime-service/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-certification.mjs'
      - 'scripts/check-s3-target-runtime.mjs'
      - 'scripts/run-s3-command-certification.mjs'
      - 'scripts/run-s3-target-runtime-tests.mjs'
      - 'scripts/test-s3-command-certification.mjs'
      - 'scripts/test-s3-target-image-evidence.mjs'
      - 'scripts/write-s3-target-image-evidence.mjs'
      - 'scripts/aggregate-s3-target-image-evidence.mjs'
      - 'scripts/verify-s3-command-certification.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-command-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run s3:topology:check
      - run: npm run s3:certification:pr

  signed-target-images:
    if: startsWith(github.ref, 'refs/tags/s3-v') || github.event_name == 'workflow_dispatch'
    needs: [certification-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: command-service
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/command-service/cmd/command-service
          - name: command-dispatcher
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/command-dispatcher/cmd/command-dispatcher
          - name: command-verifier
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/command-dispatcher/cmd/command-verifier
          - name: command-migrator
            dockerfile: deploy/s3/images/command-migrator.Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/hvac-web/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan image for embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: secret
          format: json
          output: trivy-secrets-${{ matrix.name }}.json
          exit-code: '1'
          hide-progress: 'true'
          timeout: 10m
      - name: Upload image secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-trivy-secrets-${{ matrix.name }}
          path: trivy-secrets-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify image signature identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign verify "$IMAGE@$DIGEST" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/s3-command-certification.yml@refs/(heads|tags)/.+$"
      - name: Publish GitHub build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record GitHub attestation skip
        if: github.event.repository.visibility != 'public'
        run: echo "::notice::Skipping GitHub build provenance for a non-public repository; BuildKit provenance and Cosign verification remain mandatory."
      - name: Record immutable S3 image evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GITHUB_ATTESTATION_STATUS: ${{ github.event.repository.visibility == 'public' && 'published' || 'skipped-non-public' }}
        run: |
          node scripts/write-s3-target-image-evidence.mjs \
            --name=${{ matrix.name }} \
            --image="$IMAGE" \
            --digest="$DIGEST" \
            --repository-sha="${GITHUB_SHA}" \
            --workflow-run-id="${GITHUB_RUN_ID}" \
            --source-ref="${GITHUB_REF}" \
            --trivy=trivy-secrets-${{ matrix.name }}.json \
            --github-attestation="$GITHUB_ATTESTATION_STATUS"
      - name: Upload immutable S3 image evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-target-image-${{ matrix.name }}
          path: out/s3-target-release/images/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate-target-image-manifest:
    if: startsWith(github.ref, 'refs/tags/s3-v') || github.event_name == 'workflow_dispatch'
    needs: [signed-target-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: s3-target-image-*
          path: out/s3-target-release/images
          merge-multiple: true
      - name: Aggregate exact four-image release manifest
        run: node scripts/aggregate-s3-target-image-evidence.mjs --input-dir=out/s3-target-release/images --output=out/s3-target-release/image-manifest.json
      - name: Upload S3 target image manifest
        uses: actions/upload-artifact@v4
        with:
          name: s3-target-image-manifest
          path: out/s3-target-release/image-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish candidate manifest as prerelease asset
        if: startsWith(github.ref, 'refs/tags/s3-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "S3 target image release candidate. This release and its manifest do not claim formal S3-09 certification." \
            out/s3-target-release/image-manifest.json
