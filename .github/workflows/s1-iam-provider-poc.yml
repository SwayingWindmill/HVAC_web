name: S1 IAM Provider POC

on:
  pull_request:
    paths:
      - '.github/workflows/s1-iam-provider-poc.yml'
      - 'scripts/check-s1-workflow-topology.mjs'
      - '.scratch/go-data-ai-platform-s1/issues/02-iam-registry-read-authorization.md'
      - '.scratch/go-data-ai-platform-s1/research/reuse-first.md'
      - 'pocs/logto-sdk-adoption/**'
      - 'scripts/run-s1-logto-sdk-adoption-poc.mjs'
      - 'scripts/run-auth-principal-browser-audit.mjs'
      - 'services/platform-gateway/internal/gateway/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s1-iam-provider-poc.yml'
      - 'scripts/check-s1-workflow-topology.mjs'
      - '.scratch/go-data-ai-platform-s1/issues/02-iam-registry-read-authorization.md'
      - '.scratch/go-data-ai-platform-s1/research/reuse-first.md'
      - 'pocs/logto-sdk-adoption/**'
      - 'scripts/run-s1-logto-sdk-adoption-poc.mjs'
      - 'scripts/run-auth-principal-browser-audit.mjs'
      - 'services/platform-gateway/internal/gateway/**'

permissions:
  contents: read

concurrency:
  group: s1-iam-provider-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run s1:topology:check
      - run: npm run s1:iam-provider-poc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-iam-provider-poc-logto-sdk-adoption-evidence
          path: |
            out/s1-iam-provider-poc/logto-sdk-adoption.json
            out/s1-iam-provider-poc/logto-comparison.json
          if-no-files-found: error
          retention-days: 14
