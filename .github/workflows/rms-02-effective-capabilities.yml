name: RMS-02 Effective Capabilities

on:
  pull_request:
    paths:
      - ".github/workflows/rms-02-effective-capabilities.yml"
      - "apps/hvac-web/**"
      - "contracts/http/**"
      - "libs/identitycontext/**"
      - "services/iam-service/**"
      - "services/platform-gateway/**"
      - "scripts/generate-platform-contracts.mjs"
      - "scripts/test-rms-principal-capability-contract.mjs"
      - "scripts/run-rms-principal-capability-browser-audit.mjs"
      - "scripts/ui-audit.mjs"
      - "scripts/run-go.mjs"
      - "package.json"
      - "package-lock.json"
      - "go.work"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rms-02-effective-capabilities.yml"
      - "apps/hvac-web/**"
      - "contracts/http/**"
      - "libs/identitycontext/**"
      - "services/iam-service/**"
      - "services/platform-gateway/**"
      - "scripts/generate-platform-contracts.mjs"
      - "scripts/test-rms-principal-capability-contract.mjs"
      - "scripts/run-rms-principal-capability-browser-audit.mjs"
      - "scripts/ui-audit.mjs"
      - "scripts/run-go.mjs"
      - "package.json"
      - "package-lock.json"
      - "go.work"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/identitycontext/go.mod
            services/iam-service/go.mod
            services/platform-gateway/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npm run rms:ticket-02

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npm run rms:ticket-02:browser
