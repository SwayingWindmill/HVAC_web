name: S2 HVAC Web Presence and Latest Telemetry

on:
  pull_request:
    paths:
      - ".github/workflows/s2-hvac-web-presence.yml"
      - "apps/hvac-web/src/api/telemetry-current.ts"
      - "apps/hvac-web/src/components/AuthenticatedPrincipalStatus.tsx"
      - "apps/hvac-web/src/components/DeviceTelemetryState.tsx"
      - "apps/hvac-web/src/pages/Assets/**"
      - "apps/hvac-web/src/platform/telemetry-live/**"
      - "apps/hvac-web/src/api/generated/s2Telemetry.gen.ts"
      - "apps/hvac-web/src/api/generated/platformGateway.gen.ts"
      - "contracts/http/s2-telemetry-public.openapi.json"
      - "scripts/check-s2-hvac-web-presence.mjs"
      - "scripts/run-s2-hvac-web-presence-browser-audit.mjs"
      - "scripts/fixtures/s2-hvac-web-presence/**"
      - "docs/operations/s2-hvac-web-presence.md"
      - "package.json"
      - "package-lock.json"
      - "deploy/s0/security/dependency-audit-baseline.json"
      - "scripts/check-npm-production-audit.mjs"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run s2:hvac-web-presence
      - name: Upload Ticket 09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-hvac-web-presence-evidence
          path: out/s2-hvac-web-presence
          if-no-files-found: error
          retention-days: 14
