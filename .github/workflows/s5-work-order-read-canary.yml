name: S5 Work Order IAM Gateway Read Canary

on:
  pull_request:
    paths:
      - '.github/workflows/s5-work-order-read-canary.yml'
      - 'apps/hvac-web/src/api/generated/platformGateway.gen.ts'
      - 'contracts/http/platform-gateway.openapi.yaml'
      - 'contracts/http/templates/platformGateway.ts.tmpl'
      - 'contracts/http/templates/platformapi.go.tmpl'
      - 'contracts/ownership/**'
      - 'docs/operations/real-product-roadmap.md'
      - 'docs/operations/s5-work-order-baseline.md'
      - 'infra/s1-registry/postgres/init/008-s5-work-order-authorization.sql'
      - 'libs/identitycontext/**'
      - 'libs/ownershipregistry/**'
      - 'libs/workorderauth/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s5-work-order-read-canary.mjs'
      - 'scripts/generate-platform-contracts.mjs'
      - 'scripts/run-s5-work-order-read-browser-audit.mjs'
      - 'services/iam-service/**'
      - 'services/platform-gateway/**'
      - 'services/work-order-service/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s5-work-order-read-canary.yml'
      - 'apps/hvac-web/src/api/generated/platformGateway.gen.ts'
      - 'contracts/http/platform-gateway.openapi.yaml'
      - 'contracts/http/templates/platformGateway.ts.tmpl'
      - 'contracts/http/templates/platformapi.go.tmpl'
      - 'contracts/ownership/**'
      - 'docs/operations/real-product-roadmap.md'
      - 'docs/operations/s5-work-order-baseline.md'
      - 'infra/s1-registry/postgres/init/008-s5-work-order-authorization.sql'
      - 'libs/identitycontext/**'
      - 'libs/ownershipregistry/**'
      - 'libs/workorderauth/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s5-work-order-read-canary.mjs'
      - 'scripts/generate-platform-contracts.mjs'
      - 'scripts/run-s5-work-order-read-browser-audit.mjs'
      - 'services/iam-service/**'
      - 'services/platform-gateway/**'
      - 'services/work-order-service/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s5-work-order-read-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run s5:work-order:read-canary
      - run: npm run s1:registry:postgres
      - run: npm run build:iam
      - run: npm run build:gateway
      - run: node scripts/run-go.mjs build -o out/work-order-service ./services/work-order-service/cmd/work-order-service
      - name: Upload Work Order IAM Gateway read canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-work-order-read-canary
          path: |
            out/s5-work-order-read-canary
            out/s1-registry-core
          if-no-files-found: error
          retention-days: 14
