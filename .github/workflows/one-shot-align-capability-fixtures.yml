name: One-shot align capability fixtures

on:
  push:
    branches:
      - feat/real-work-order-task-checklist

permissions:
  contents: write

jobs:
  align-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/real-work-order-task-checklist
          fetch-depth: 0

      - name: Align stale principal fixtures with capability set v7
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('scripts/fixtures/real-alarms/main.tsx'),
              Path('scripts/fixtures/s2-hvac-web-presence/harness.tsx'),
              Path('scripts/run-operations-workspace-browser-audit.mjs'),
              Path('scripts/run-rms-authenticated-shell-browser-audit.mjs'),
              Path('scripts/run-rms-principal-capability-browser-audit.mjs'),
              Path('scripts/run-s1-hvac-web-registry-browser-audit.mjs'),
              Path('scripts/run-s2-hvac-web-presence-browser-audit.mjs'),
              Path('scripts/test-rms-shell-runtime.mjs'),
              Path('scripts/ui-audit.mjs'),
          ]
          old = 'capabilitySetVersion: 6'
          new = 'capabilitySetVersion: 7'
          changed = []
          replacements = 0

          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append((str(path), count))
                  replacements += count

          if replacements == 0:
              raise SystemExit('No stale capability set v6 fixture was found')

          for path, count in changed:
              print(f'{path}: {count} replacement(s)')
          print(f'total replacements: {replacements}')
          PY

      - name: Commit fixture alignment and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-align-capability-fixtures.yml
          git add \
            scripts/fixtures/real-alarms/main.tsx \
            scripts/fixtures/s2-hvac-web-presence/harness.tsx \
            scripts/run-operations-workspace-browser-audit.mjs \
            scripts/run-rms-authenticated-shell-browser-audit.mjs \
            scripts/run-rms-principal-capability-browser-audit.mjs \
            scripts/run-s1-hvac-web-registry-browser-audit.mjs \
            scripts/run-s2-hvac-web-presence-browser-audit.mjs \
            scripts/test-rms-shell-runtime.mjs \
            scripts/ui-audit.mjs
          git diff --cached --check
          git commit -m "test(fixtures): align capability set v7"
          git push origin HEAD:feat/real-work-order-task-checklist
