name: S1 Registry Web

on:
  pull_request:
    branches-ignore: ["**"]
    paths:
      - '.github/workflows/s1-registry-web.yml'
      - 'scripts/check-s1-workflow-topology.mjs'
      - 'apps/hvac-web/**'
      - 'contracts/http/**'
      - 'docs/operations/s1-hvac-web-registry.md'
      - 'scripts/build-s1-hvac-web-registry.mjs'
      - 'scripts/check-s1-hvac-web-registry.mjs'
      - 'scripts/run-s1-hvac-web-registry-browser-audit.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s1-registry-web.yml'
      - 'scripts/check-s1-workflow-topology.mjs'
      - 'apps/hvac-web/**'
      - 'contracts/http/**'
      - 'docs/operations/s1-hvac-web-registry.md'
      - 'scripts/build-s1-hvac-web-registry.mjs'
      - 'scripts/check-s1-hvac-web-registry.mjs'
      - 'scripts/run-s1-hvac-web-registry-browser-audit.mjs'

permissions:
  contents: read

concurrency:
  group: s1-registry-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run s1:topology:check
      - run: npm run s1:registry-web

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run audit:s1-registry-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-registry-web-hvac-web-registry-browser
          path: out/s1-registry-web/hvac-web-registry-browser.json
          if-no-files-found: error
          retention-days: 14
