name: RMS Web Certification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  certify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            libs/identitycontext/go.mod
            libs/ownershipregistry/go.mod
            libs/registryauth/go.mod
            modules/iam/go.mod
            cmd/energy-api/go.mod
      - run: npm ci
      - run: npm run rms:web-certification
      - name: Upload RMS certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rms-web-certification-${{ github.sha }}
          path: |
            out/rms-web-certification
            out/rms-web-build/real-dependency-graph.json
            out/rms-web-build/build-artifact-audit.json
          if-no-files-found: warn
          retention-days: 30
