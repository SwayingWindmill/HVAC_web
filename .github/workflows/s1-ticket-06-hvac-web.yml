name: S1 Ticket 06 HVAC Web Registry

on:
  pull_request:
    paths:
      - '.github/workflows/s1-ticket-06-hvac-web.yml'
      - 'apps/hvac-web/**'
      - 'contracts/http/**'
      - 'docs/operations/s1-hvac-web-registry.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-s1-hvac-web-registry.mjs'
      - 'scripts/check-s1-hvac-web-registry.mjs'
      - 'scripts/run-s1-hvac-web-registry-browser-audit.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s1-ticket-06-hvac-web.yml'
      - 'apps/hvac-web/**'
      - 'contracts/http/**'
      - 'docs/operations/s1-hvac-web-registry.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-s1-hvac-web-registry.mjs'
      - 'scripts/check-s1-hvac-web-registry.mjs'
      - 'scripts/run-s1-hvac-web-registry-browser-audit.mjs'

permissions:
  contents: read

concurrency:
  group: s1-ticket-06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run s1:registry:check
      - run: npm run s1:hvac-web:check
      - run: npm run lint
      - run: npm run s1:hvac-web:build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run audit:s1-hvac-web-registry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-ticket-06-hvac-web-registry-browser
          path: out/s1-ticket-06/hvac-web-registry-browser.json
          if-no-files-found: error
          retention-days: 14
