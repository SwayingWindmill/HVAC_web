name: S2 Gateway Snapshot and Batch

on:
  pull_request:
    paths:
      - ".github/workflows/s2-gateway-snapshot.yml"
      - "contracts/http/s2-telemetry-public.openapi.json"
      - "contracts/http/s2-tooling.lock.json"
      - "contracts/ownership/route-ownership.v1.json"
      - "apps/hvac-web/src/api/generated/s2Telemetry.gen.ts"
      - "services/platform-gateway/**"
      - "services/iam-service/**"
      - "services/telemetry-runtime-service/**"
      - "libs/identitycontext/**"
      - "libs/oidctest/**"
      - "libs/ownershipregistry/**"
      - "libs/telemetryauth/**"
      - "libs/testpki/**"
      - "scripts/generate-s2-telemetry-contracts.mjs"
      - "scripts/check-s2-gateway-snapshot.mjs"
      - "scripts/s0-auth-topology.mjs"
      - "scripts/run-s2-gateway-browser-audit.mjs"
      - "docs/operations/s2-gateway-snapshot.md"
      - "package.json"
      - "package-lock.json"
      - "go.work"
      - "go.work.sum"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOMAXPROCS: 2
  GOFLAGS: -p=1

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run s2:gateway-snapshot
      - name: Upload Ticket 05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-gateway-snapshot-evidence
          path: out/s2-ticket-05
          if-no-files-found: error
          retention-days: 14
