name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096
  DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || '139.199.58.47' }}
  DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
  DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}

jobs:
  deploy:
    name: deploy / production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Deploy only main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy ${GITHUB_REF}. This workflow deploys refs/heads/main only."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Require deploy credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: bash deploy/platform/phase1/cd/push-release.sh --check-credentials

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/operations-agent-service/package-lock.json

      - name: Build release artifacts
        run: bash deploy/platform/phase1/cd/build-release.sh

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: bash deploy/platform/phase1/cd/push-release.sh
