name: One-shot restore S5 check line endings

on:
  push:
    branches:
      - feat/real-work-order-task-checklist

permissions:
  contents: write

jobs:
  restore-line-endings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/real-work-order-task-checklist
          fetch-depth: 0

      - name: Restore CRLF without changing content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-s5-work-order-tasks.mjs')
          text = path.read_bytes().decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY

      - name: Commit line ending restoration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-restore-s5-check-line-endings.yml
          git add scripts/check-s5-work-order-tasks.mjs
          git diff --cached --check
          git commit -m "chore(work-order): preserve S5 gate line endings"
          git push origin HEAD:feat/real-work-order-task-checklist
