name: S3 Ticket 03 Command Governance

on:
  pull_request:
    paths:
      - '.github/workflows/s3-ticket-03.yml'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandauth/**'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'scripts/check-s3-command-governance-dispatch.mjs'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/run-s3-command-postgres-tests.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s3-ticket-03.yml'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandauth/**'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'scripts/check-s3-command-governance-dispatch.mjs'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/run-s3-command-postgres-tests.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: s3-ticket-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run s3:ticket-03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-ticket-03-command-governance
          path: out/s3-ticket-02/postgres-authority.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run lint
      - run: npm run build
