name: S2 Telemetry Runtime Authoritative Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/s2-telemetry-runtime-snapshot.yml"
      - "contracts/http/s2-telemetry-public.openapi.json"
      - "contracts/ownership/**"
      - "contracts/telemetry/**"
      - "infra/s2-telemetry/**"
      - "libs/telemetryauth/**"
      - "services/telemetry-runtime-service/**"
      - "scripts/check-s2-telemetry-baseline.mjs"
      - "scripts/check-s2-telemetry-runtime-snapshot.mjs"
      - "scripts/run-s2-telemetry-postgres-tests.mjs"
      - "scripts/run-s2-telemetry-runtime-postgres-tests.mjs"
      - "scripts/check-s0-release-evidence-assets.mjs"
      - "package.json"
      - "go.work"
      - "go.work.sum"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOMAXPROCS: 2
  GOFLAGS: -p=1

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run s2:telemetry-runtime-snapshot
      - name: Upload Ticket 03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-telemetry-runtime-snapshot-evidence
          path: out/s2-telemetry-runtime-snapshot
          if-no-files-found: error
          retention-days: 14
