name: S1 Ticket 05 Registry Routing Cutover

on:
  pull_request:
    paths:
      - '.github/workflows/s1-ticket-05-routing.yml'
      - 'contracts/http/**'
      - 'contracts/ownership/**'
      - 'docs/operations/s1-registry-routing-cutover.md'
      - 'infra/s0-durable/postgres/init/**'
      - 'libs/identitycontext/**'
      - 'libs/ownershipregistry/**'
      - 'services/platform-gateway/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s1-registry-baseline.mjs'
      - 'scripts/run-s1-registry-postgres-tests.mjs'
      - 'tools/legacy-private-fixture/**'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s1-ticket-05-routing.yml'
      - 'contracts/http/**'
      - 'contracts/ownership/**'
      - 'docs/operations/s1-registry-routing-cutover.md'
      - 'infra/s0-durable/postgres/init/**'
      - 'libs/identitycontext/**'
      - 'libs/ownershipregistry/**'
      - 'services/platform-gateway/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s1-registry-baseline.mjs'
      - 'scripts/run-s1-registry-postgres-tests.mjs'
      - 'tools/legacy-private-fixture/**'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: s1-ticket-05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run ownership:check
      - run: npm run s1:registry:check
      - run: npm run test:registry-routing
      - run: node scripts/run-isolated-go.mjs --module=libs/identitycontext vet ./...
      - run: node scripts/run-isolated-go.mjs --module=libs/ownershipregistry vet ./...
      - run: node scripts/run-isolated-go.mjs --module=services/platform-gateway vet ./...
      - run: node scripts/run-isolated-go.mjs --module=tools/legacy-private-fixture vet ./...
      - run: npm run build:gateway
      - run: node scripts/run-isolated-go.mjs --module=tools/legacy-private-fixture build ./cmd/legacy-private-fixture

  postgres-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      S1_REGISTRY_REPORT_PATH: out/s1-ticket-05/postgres-routing.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: docker compose -f infra/s1-registry/compose.yaml config
      - run: npm run s1:registry:postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-ticket-05-postgres-routing
          path: out/s1-ticket-05/postgres-routing.json
          if-no-files-found: error
          retention-days: 14

  durable-route-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: docker compose -f infra/s0-durable/compose.yaml config
      - run: npm run test:durable-postgres
