name: S3 Ticket 09 Command Certification

on:
  pull_request:
    paths:
      - '.github/workflows/s3-ticket-09.yml'
      - 'contracts/ownership/**'
      - 'contracts/thingsboard/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-certification.mjs'
      - 'scripts/run-s3-command-certification.mjs'
      - 'scripts/test-s3-command-certification.mjs'
      - 'scripts/verify-s3-command-certification.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s3-ticket-09.yml'
      - 'contracts/ownership/**'
      - 'contracts/thingsboard/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-certification.mjs'
      - 'scripts/run-s3-command-certification.mjs'
      - 'scripts/test-s3-command-certification.mjs'
      - 'scripts/verify-s3-command-certification.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: s3-ticket-09-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - run: npm run s3:ticket-09
