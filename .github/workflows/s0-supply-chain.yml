name: S0 Reproducible Delivery and Supply Chain

on:
  pull_request:
    branches-ignore: ["**"]
    paths:
      - ".github/workflows/s0-supply-chain.yml"
      - "deploy/s0/**"
      - "infra/s0-durable/**"
      - "libs/**"
      - "services/**"
      - "tools/**"
      - "scripts/audit-s0-rollout.mjs"
      - "scripts/build-s0-release-evidence.mjs"
      - "scripts/check-npm-production-audit.mjs"
      - "scripts/check-observability-assets.mjs"
      - "scripts/check-ownership-registries.mjs"
      - "scripts/check-production-licenses.mjs"
      - "scripts/check-rms-real-build-graph.mjs"
      - "scripts/check-rms-real-bundle.mjs"
      - "scripts/check-s0-delivery-assets.mjs"
      - "scripts/check-s0-network-policies.mjs"
      - "scripts/check-s0-release-evidence-assets.mjs"
      - "scripts/check-s0-security-failure-assets.mjs"
      - "scripts/check-s1-hvac-web-registry.mjs"
      - "scripts/check-s2-hvac-web-presence.mjs"
      - "scripts/check-s2-shadow-routing.mjs"
      - "scripts/check-s2-telemetry-live-client.mjs"
      - "scripts/check-session-event-contract.mjs"
      - "scripts/dev-s0-durable.mjs"
      - "scripts/generate-platform-contracts.mjs"
      - "scripts/generate-s2-telemetry-contracts.mjs"
      - "scripts/render-s0-staging.mjs"
      - "scripts/rms-certification-evidence-lib.mjs"
      - "scripts/rms-real-build-audit-lib.mjs"
      - "scripts/lib/docker-cli.mjs"
      - "scripts/run-durable-postgres-tests.mjs"
      - "scripts/run-durable-session-browser-audit.mjs"
      - "scripts/run-go-vulnerability-scan.mjs"
      - "scripts/run-go.mjs"
      - "scripts/run-rms-authenticated-shell-browser-audit.mjs"
      - "scripts/run-s0-kind-rollout.mjs"
      - "scripts/run-s0-security-failure-gates.mjs"
      - "scripts/run-s2-hvac-web-presence-browser-audit.mjs"
      - "scripts/run-s2-telemetry-live-browser-audit.mjs"
      - "scripts/s0-durable-topology.mjs"
      - "scripts/test-central-plant-telemetry.mjs"
      - "scripts/test-npm-production-audit-retry.mjs"
      - "scripts/test-react-router-security-upgrade.mjs"
      - "scripts/test-render-s0-staging.mjs"
      - "scripts/test-rms-authenticated-shell-policy.mjs"
      - "scripts/test-rms-certification-evidence.mjs"
      - "scripts/test-rms-feature-route-policy.mjs"
      - "scripts/test-rms-protected-scope.mjs"
      - "scripts/test-rms-realtime-status.mjs"
      - "scripts/test-rms-shell-runtime.mjs"
      - "scripts/test-rms-site-routing.mjs"
      - "scripts/test-s0-release-evidence.mjs"
      - "scripts/validate-s0-delivery-config.mjs"
      - "scripts/verify-s0-release-images.mjs"
      - "scripts/write-s0-release-image-evidence.mjs"
      - "contracts/**"
      - "apps/hvac-web/**"
      - "go.work"
      - "go.work.sum"
  push:
    branches: [main]
    tags: ["s0-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            tools/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run delivery:validate
      - run: npm run delivery:check
      - run: npm run release:evidence-assets
      - run: npm run test:release-evidence
      - run: npm run events:check
      - run: npm run ownership:check
      - run: npm run contracts:check
      - run: npm run test:observability
      - run: npm run test:durable-postgres
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:s0-rollout

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build_mode: manual
            artifact: go
          - language: javascript-typescript
            build_mode: none
            artifact: javascript-typescript
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            tools/*/go.mod
      - uses: github/codeql-action/init@v4
        with:
          build-mode: ${{ matrix.build_mode }}
          languages: ${{ matrix.language }}
      - if: matrix.language == 'go'
        name: Build Go workspace for CodeQL
        run: |
          go build ./services/platform-gateway/cmd/platform-gateway
          go build ./services/iam-service/cmd/iam-service
          go build ./services/audit-ledger-service/cmd/audit-ledger-service
          go build ./services/outbox-relay/cmd/outbox-relay
          go build ./services/oidc-test-provider/cmd/oidc-test-provider
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results-${{ matrix.artifact }}
          upload: never
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: codeql-sarif-${{ matrix.artifact }}
          path: codeql-results-${{ matrix.artifact }}
          retention-days: 14

  dependency-and-license:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - name: Root full dependency audit evidence
        continue-on-error: true
        run: npm audit
      - run: npm run security:dependency-audit
      - run: npm run security:go-vuln
      - run: npm run security:licenses

  security-failure-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            tools/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run security:gates
      - name: Upload S0 security gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0-security-gate-results
          path: out/s0-security
          if-no-files-found: error
          retention-days: 14

  signed-images:
    if: startsWith(github.ref, 'refs/tags/s0-v') || github.event_name == 'workflow_dispatch'
    needs: [verify, codeql, dependency-and-license, security-failure-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform-gateway
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/platform-gateway/cmd/platform-gateway
          - name: iam-service
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/iam-service/cmd/iam-service
          - name: audit-ledger-service
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/audit-ledger-service/cmd/audit-ledger-service
          - name: outbox-relay
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/outbox-relay/cmd/outbox-relay
          - name: oidc-test-provider
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/oidc-test-provider/cmd/oidc-test-provider
          - name: s0-migrator
            dockerfile: deploy/s0/images/migrator.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/hvac-web/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          build-args: ${{ matrix.build_args }}
          sbom: true
          provenance: mode=max
      - name: Scan image for embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: secret
          format: json
          output: trivy-secrets-${{ matrix.name }}.json
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m
      - name: Upload image secret scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secrets-${{ matrix.name }}
          path: trivy-secrets-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: sigstore/cosign-installer@v3.8.2
      - env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign verify "$IMAGE@$DIGEST" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/s0-supply-chain.yml@refs/(heads|tags)/.+$"
      - name: Publish GitHub build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record GitHub attestation skip
        if: github.event.repository.visibility != 'public'
        run: echo "::notice::Skipping GitHub build provenance attestation for a non-public repository; BuildKit provenance and Cosign verification remain release requirements."
      - name: Record immutable release image evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GITHUB_ATTESTATION_STATUS: ${{ github.event.repository.visibility == 'public' && 'published' || 'skipped-non-public' }}
        run: |
          node scripts/write-s0-release-image-evidence.mjs \
            --name=${{ matrix.name }} \
            --image="$IMAGE" \
            --digest="$DIGEST" \
            --trivy=trivy-secrets-${{ matrix.name }}.json \
            --github-attestation="$GITHUB_ATTESTATION_STATUS"
      - name: Upload immutable release image evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.name }}
          path: out/s0-release-evidence/images/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/s0-v') || github.event_name == 'workflow_dispatch'
    needs: [signed-images]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            tools/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download security and failure evidence
        uses: actions/download-artifact@v4
        with:
          name: s0-security-gate-results
          path: out/s0-security
      - name: Download immutable image manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: out/s0-release-input/images
          merge-multiple: true
      - name: Download Trivy image evidence
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-secrets-*
          path: out/s0-release-input/trivy
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Create disposable Kubernetes evidence cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.35.0
          cluster_name: s0-release-evidence
          wait: 120s
      - run: npm run release:evidence-assets
      - run: npm run audit:s0-rollout -- --report=out/s0-release-evidence/rollout-model-report.json
      - run: npm run audit:s0-kind-rollout
      - run: npm run release:evidence:images
      - run: npm run release:evidence:build
      - name: Upload S0 Release Evidence Bundle
        uses: actions/upload-artifact@v4
        with:
          name: s0-release-evidence-bundle
          path: out/s0-release-evidence
          if-no-files-found: error
          retention-days: 30
