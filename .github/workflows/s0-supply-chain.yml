name: S0 Reproducible Delivery and Supply Chain

on:
  pull_request:
    paths:
      - ".github/workflows/s0-supply-chain.yml"
      - "deploy/s0/**"
      - "infra/s0-durable/**"
      - "libs/**"
      - "services/**"
      - "tools/**"
      - "scripts/**"
      - "contracts/**"
      - "apps/hvac-web/**"
      - "package.json"
      - "package-lock.json"
      - "go.work"
      - "go.work.sum"
  push:
    branches: [main]
    tags: ["s0-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            tools/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run delivery:validate
      - run: npm run delivery:check
      - run: npm run events:check
      - run: npm run ownership:check
      - run: npm run contracts:check
      - run: npm run test:observability
      - run: npm run test:legacy-compatibility
      - run: npm run test:durable-postgres
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:s0-rollout

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: github/codeql-action/init@v4
        with:
          build-mode: manual
          languages: go,javascript-typescript
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: npm ci
      - run: npm run build
      - run: npm run build:gateway
      - run: npm run build:iam
      - run: npm run build:audit-ledger
      - run: npm run build:outbox-relay
      - run: npm run build:oidc-fixture
      - run: npm run build:legacy-compatibility
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: never
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: codeql-sarif
          path: codeql-results
          retention-days: 14

  dependency-and-license:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - name: Root full dependency audit evidence
        continue-on-error: true
        run: npm audit
      - run: npm run security:dependency-audit
      - run: npm run security:go-vuln
      - run: npm run security:licenses

  signed-images:
    if: startsWith(github.ref, 'refs/tags/s0-v') || github.event_name == 'workflow_dispatch'
    needs: [verify, codeql, dependency-and-license]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform-gateway
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/platform-gateway/cmd/platform-gateway
          - name: iam-service
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/iam-service/cmd/iam-service
          - name: audit-ledger-service
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/audit-ledger-service/cmd/audit-ledger-service
          - name: outbox-relay
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/outbox-relay/cmd/outbox-relay
          - name: oidc-test-provider
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./services/oidc-test-provider/cmd/oidc-test-provider
          - name: legacy-private
            dockerfile: deploy/s0/images/go-service.Dockerfile
            build_args: SERVICE_PACKAGE=./tools/legacy-private-fixture/cmd/legacy-private-fixture
          - name: s0-migrator
            dockerfile: deploy/s0/images/migrator.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/hvac-web/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          build-args: ${{ matrix.build_args }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3.8.2
      - env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign verify "$IMAGE@$DIGEST" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/s0-supply-chain.yml@refs/(heads|tags)/.+$"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
