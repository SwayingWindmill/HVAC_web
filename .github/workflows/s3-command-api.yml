name: S3 Command API

on:
  pull_request:
    branches-ignore: ["**"]
    paths:
      - '.github/workflows/s3-command-api.yml'
      - 'scripts/check-s3-workflow-topology.mjs'
      - 'contracts/http/s3-command-public.openapi.json'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandauth/**'
      - 'libs/commandmodel/**'
      - 'services/iam-service/**'
      - 'services/command-service/**'
      - 'services/platform-gateway/**'
      - 'scripts/check-s3-command-gateway.mjs'
      - 'scripts/check-ownership-registries.mjs'
      - 'go.work'
      - 'go.work.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s3-command-api.yml'
      - 'scripts/check-s3-workflow-topology.mjs'
      - 'contracts/http/s3-command-public.openapi.json'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandauth/**'
      - 'libs/commandmodel/**'
      - 'services/iam-service/**'
      - 'services/command-service/**'
      - 'services/platform-gateway/**'
      - 'scripts/check-s3-command-gateway.mjs'
      - 'scripts/check-ownership-registries.mjs'
      - 'go.work'
      - 'go.work.sum'

permissions:
  contents: read

concurrency:
  group: s3-command-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-command-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run s3:topology:check
      - run: npm run s3:command-api
      - run: npm run lint
      - run: npm run build
