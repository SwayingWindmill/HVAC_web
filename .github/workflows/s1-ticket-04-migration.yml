name: S1 Ticket 04 Legacy Registry Migration

on:
  pull_request:
    paths:
      - '.github/workflows/s1-ticket-04-migration.yml'
      - 'contracts/ownership/**'
      - 'contracts/registry/**'
      - 'infra/s1-registry/**'
      - 'services/legacy-migration-service/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s0-release-evidence-assets.mjs'
      - 'scripts/check-s1-registry-baseline.mjs'
      - 'scripts/run-s1-registry-postgres-tests.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s1-ticket-04-migration.yml'
      - 'contracts/ownership/**'
      - 'contracts/registry/**'
      - 'infra/s1-registry/**'
      - 'services/legacy-migration-service/**'
      - 'scripts/check-ownership-registries.mjs'
      - 'scripts/check-s0-release-evidence-assets.mjs'
      - 'scripts/check-s1-registry-baseline.mjs'
      - 'scripts/run-s1-registry-postgres-tests.mjs'
      - 'go.work'
      - 'go.work.sum'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: s1-ticket-04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run ownership:check
      - run: npm run s1:registry:check
      - run: npm run test:legacy-migration
      - run: node scripts/run-isolated-go.mjs --module=services/legacy-migration-service vet ./...
      - run: npm run build:legacy-migration
      - run: npm run test:security-negative
      - run: npm run release:evidence-assets
      - run: node scripts/run-isolated-go.mjs --module=services/legacy-migration-service mod verify
      - run: node scripts/run-isolated-go.mjs --module=services/legacy-migration-service run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      S1_REGISTRY_REPORT_PATH: out/s1-ticket-04/postgres-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: docker compose -f infra/s1-registry/compose.yaml config
      - run: npm run s1:registry:postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-ticket-04-postgres-evidence
          path: out/s1-ticket-04/postgres-baseline.json
          if-no-files-found: error
          retention-days: 14
