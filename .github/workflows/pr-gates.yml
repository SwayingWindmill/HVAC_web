name: PR Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOMAXPROCS: 2
  GOFLAGS: -p=1

jobs:
  classify:
    name: pr / classify
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.classify.outputs.contracts }}
      units: ${{ steps.classify.outputs.units }}
      integrations: ${{ steps.classify.outputs.integrations }}
      contract_profiles: ${{ steps.classify.outputs.contract_profiles }}
      unit_profiles: ${{ steps.classify.outputs.unit_profiles }}
      integration_profiles: ${{ steps.classify.outputs.integration_profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - id: classify
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-pr-gates.mjs --base="$GITHUB_BASE_SHA" --head="$GITHUB_HEAD_SHA"

  static:
    name: pr / static
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful classification
        run: test "${{ needs.classify.result }}" = "success"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run --silent repo:check
      - run: npm run --silent design:check
      - run: npm run --silent lint
      - run: npm run --silent build:demo
      - run: npm run --silent pr:gates:test

  contracts_run:
    name: internal / contracts
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/run-pr-gate.mjs --gate=contracts --profiles="${{ needs.classify.outputs.contract_profiles }}"

  contracts:
    name: pr / contracts
    needs: [classify, contracts_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate contract result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_RESULT: ${{ needs.contracts_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$EXECUTION_RESULT" = "success" || test "$EXECUTION_RESULT" = "skipped"

  unit_run:
    name: internal / affected unit
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.units == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
            pocs/*/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/run-pr-gate.mjs --gate=unit --profiles="${{ needs.classify.outputs.unit_profiles }}"

  unit:
    name: pr / affected-unit
    needs: [classify, unit_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate unit result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_RESULT: ${{ needs.unit_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$EXECUTION_RESULT" = "success" || test "$EXECUTION_RESULT" = "skipped"

  integration_run:
    name: internal / affected integration
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.integrations == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            libs/*/go.mod
            services/*/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/run-pr-gate.mjs --gate=integration --profiles="${{ needs.classify.outputs.integration_profiles }}"

  integration:
    name: pr / affected-integration
    needs: [classify, integration_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate integration result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_RESULT: ${{ needs.integration_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$EXECUTION_RESULT" = "success" || test "$EXECUTION_RESULT" = "skipped"
