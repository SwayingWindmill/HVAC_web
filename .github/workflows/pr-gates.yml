name: PR Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  GOMAXPROCS: 4
  GOFLAGS: -p=2

jobs:
  classify:
    name: pr / classify
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.classify.outputs.contracts }}
      units: ${{ steps.classify.outputs.units }}
      unit_go_lint: ${{ steps.classify.outputs.unit_go_lint }}
      unit_web: ${{ steps.classify.outputs.unit_web }}
      unit_domain: ${{ steps.classify.outputs.unit_domain }}
      integrations: ${{ steps.classify.outputs.integrations }}
      contract_profiles: ${{ steps.classify.outputs.contract_profiles }}
      unit_profiles: ${{ steps.classify.outputs.unit_profiles }}
      unit_domain_profiles: ${{ steps.classify.outputs.unit_domain_profiles }}
      integration_profiles: ${{ steps.classify.outputs.integration_profiles }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
      - id: classify
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/classify-pr-gates.ts --base="$GITHUB_BASE_SHA" --head="$GITHUB_HEAD_SHA"

  static:
    name: pr / static
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful classification
        run: test "${{ needs.classify.result }}" = "success"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - run: npm ci
      - run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=static
      - run: npm run --silent pr:gates:test

  contracts_run:
    name: internal / contracts
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration freeze check reads registered migrations at the PR's base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=contracts --profiles="${{ needs.classify.outputs.contract_profiles }}"

  contracts:
    name: pr / contracts
    needs: [classify, contracts_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate contract result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_RESULT: ${{ needs.contracts_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$EXECUTION_RESULT" = "success" || test "$EXECUTION_RESULT" = "skipped"

  unit_go_lint_run:
    name: internal / affected go-lint
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.unit_go_lint == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.mod
            go.sum
            go.work.sum
            cmd/*/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Export Go build and tool caches
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "HVAC_GO_TOOLS_DIR=$HOME/.cache/hvac-go-tools" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hvac-go-tools
          key: hvac-go-tools-${{ runner.os }}-${{ hashFiles('go.work', 'scripts/run-go-lint.mjs', 'scripts/run-go-vulnerability-scan.mjs') }}
      - run: npm ci
      - run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=unit --profiles="go"

  unit_web_run:
    name: internal / affected web-unit
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.unit_web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=unit --profiles="web"

  unit_domain_run:
    name: internal / affected domain-unit
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.unit_domain == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.mod
            go.sum
            go.work.sum
            cmd/*/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Export Go build cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
      - run: npm ci
      # Every Go test in the unit gate runs with the race detector (needs cgo; the runner image has gcc).
      # -p=2 repeats the workflow-wide GOFLAGS, which a step-level GOFLAGS replaces rather than extends.
      - env:
          GOFLAGS: -p=2 -race
        run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=unit --profiles="${{ needs.classify.outputs.unit_domain_profiles }}"

  unit:
    name: pr / affected-unit
    needs: [classify, unit_go_lint_run, unit_web_run, unit_domain_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate unit result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GO_LINT_RESULT: ${{ needs.unit_go_lint_run.result }}
          WEB_RESULT: ${{ needs.unit_web_run.result }}
          DOMAIN_RESULT: ${{ needs.unit_domain_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$GO_LINT_RESULT" = "success" || test "$GO_LINT_RESULT" = "skipped"
          test "$WEB_RESULT" = "success" || test "$WEB_RESULT" = "skipped"
          test "$DOMAIN_RESULT" = "success" || test "$DOMAIN_RESULT" = "skipped"

  integration_run:
    name: internal / affected integration
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.integrations == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.mod
            go.sum
            go.work.sum
            cmd/*/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Export Go build cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node --experimental-strip-types scripts/run-pr-gate.ts --gate=integration --profiles="${{ needs.classify.outputs.integration_profiles }}"

  integration:
    name: pr / affected-integration
    needs: [classify, integration_run]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate integration result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_RESULT: ${{ needs.integration_run.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          test "$EXECUTION_RESULT" = "success" || test "$EXECUTION_RESULT" = "skipped"
