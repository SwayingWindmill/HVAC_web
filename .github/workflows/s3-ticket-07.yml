name: S3 Ticket 07 Reported State Verification

on:
  pull_request:
    paths:
      - '.github/workflows/s3-ticket-07.yml'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/adr/0006-s3-command-intent-attempt-safety.md'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-verification.mjs'
      - 'scripts/run-s3-command-postgres-tests.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s3-ticket-07.yml'
      - 'contracts/ownership/**'
      - 'deploy/s3/**'
      - 'docs/adr/0006-s3-command-intent-attempt-safety.md'
      - 'docs/operations/s3-implementation-plan.md'
      - 'libs/commandmodel/**'
      - 'services/command-service/**'
      - 'services/command-dispatcher/**'
      - 'services/thingsboard-connector-control/**'
      - 'scripts/check-s3-command-verification.mjs'
      - 'scripts/run-s3-command-postgres-tests.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: s3-ticket-07-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reported-state-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - run: npm run s3:ticket-07
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-ticket-07-postgres-verification
          path: out/s3-ticket-02/postgres-authority.json
          if-no-files-found: error
          retention-days: 14
