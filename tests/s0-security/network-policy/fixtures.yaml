apiVersion: v1
kind: Namespace
metadata:
  name: public-ingress
  labels:
    s0.hvac/public-ingress: "true"
---
apiVersion: v1
kind: Pod
metadata:
  name: browser-probe
  namespace: public-ingress
  labels: { app: browser-probe }
spec:
  containers:
    - name: probe
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: platform-gateway
  namespace: s0-staging
  labels: { app: platform-gateway }
spec:
  containers:
    - name: gateway
      image: registry.k8s.io/pause:3.10
      ports: [{ name: http, containerPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: iam-service
  namespace: s0-staging
  labels: { app: iam-service }
spec:
  containers:
    - name: iam
      image: registry.k8s.io/pause:3.10
      ports: [{ name: https, containerPort: 8444 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: audit-ledger-service
  namespace: s0-staging
  labels: { app: audit-ledger-service }
spec:
  containers:
    - name: audit
      image: registry.k8s.io/pause:3.10
      ports: [{ name: https, containerPort: 8446 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: outbox-relay
  namespace: s0-staging
  labels: { app: outbox-relay }
spec:
  containers:
    - name: relay
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: oidc-test-provider
  namespace: s0-staging
  labels: { app: oidc-test-provider }
spec:
  containers:
    - name: oidc
      image: registry.k8s.io/pause:3.10
      ports: [{ name: https, containerPort: 8443 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: legacy-private
  namespace: s0-staging
  labels: { app: legacy-private }
spec:
  containers:
    - name: legacy
      image: registry.k8s.io/pause:3.10
      ports: [{ name: https, containerPort: 8445 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: s0-schema-migration
  namespace: s0-staging
  labels: { app: s0-schema-migration }
spec:
  containers:
    - name: migrator
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: s0-staging
  labels: { app: postgres }
spec:
  containers:
    - name: postgres
      image: postgres:16.4-bookworm
      ports: [{ name: postgres, containerPort: 5432 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: redpanda
  namespace: s0-staging
  labels: { app: redpanda }
spec:
  containers:
    - name: redpanda
      image: redpandadata/redpanda:v24.2.18
      ports: [{ name: kafka, containerPort: 9092 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: otel-collector
  namespace: s0-staging
  labels: { app: otel-collector }
spec:
  containers:
    - name: otel-collector
      image: otel/opentelemetry-collector-contrib:0.111.0
      ports: [{ name: otlp-http, containerPort: 4318 }]
