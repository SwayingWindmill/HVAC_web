# Internal cubes over the projected energy facts. Nothing queries them directly: the views in
# ../views are the public surface (ADR 0023). Titles and descriptions are Chinese because the
# views carry them to operators and to the Operations Agent.

# The Site and equipment cubes read whole hours from the hourly rollup (015-energy-hourly-rollup.sql)
# and single facts only for an hour the queried range cuts into, so a month report no longer
# groups every fact revision of the month. Interval facts follow Option A half-open attribution
# (period_start, period_end], so each fact is attributed at addMilliseconds(period_end, -1) and
# energy_hourly buckets by toStartOfHour(addMilliseconds(period_end, -1)). Cube renders the range
# as period_end >= From and period_end <= the second before To, so an hour is whole when its start
# and its last second both pass the filter; the single facts take exactly the other hours. Cube
# renders an absent filter as 1 = 1, which makes every hour whole. A rollup row stands at its hour's
# start, inside the bucket of every fact it holds for any whole-hour timezone; a Site in a half-hour
# timezone would split hours and needs the single facts. Every row carries interval_count, 1 for a
# single fact, which the count measures add up. Cross-gap intervals (> 1 hour) stay out of
# hourly/daily curves and expose separate cross-gap measures (#798). The cost cube uses the
# hourly rollup for unsplit whole hours and reads single facts only for boundary partial hours or
# hours split by a sub-hour tariff window.
cubes:
  - name: energy_facts
    public: false
    title: 能耗区间
    description: 电表累计读数投影成的可相加能耗区间，带质量、数据截至时间和数据版本。
    sql: >
      SELECT * REPLACE (addMilliseconds(period_end, -1) AS period_end),
             toInt64(1) AS interval_count, toUInt8(0) AS is_cross_gap
      FROM analytics.energy_interval_facts_visible

    measures:
      - name: energy_valid_kwh
        title: 能耗（有效数据）
        description: 只算质量判定为「有效」且非跨缺口的读数，单位 kWh。必须同时按能源类型筛选，否则会把用电量和供冷量加在一起。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID'"

      - name: energy_valid_and_suspect_kwh
        title: 能耗（含可疑数据）
        description: 包括质量为「有效」和「可疑」且非跨缺口的读数，单位 kWh；可疑读数较多时用来估算上限。同样必须按能源类型筛选。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: cross_gap_valid_kwh
        title: 跨缺口能耗（有效数据）
        description: 累计读数前后相隔超过 1 小时的有效能耗之和，单位 kWh；计入月度总量，不摊入逐时或逐日曲线。必须按能源类型筛选。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality = 'VALID'"

      - name: cross_gap_valid_and_suspect_kwh
        title: 跨缺口能耗（含可疑数据）
        description: 累计读数前后相隔超过 1 小时的有效与可疑能耗之和，单位 kWh。必须按能源类型筛选。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: valid_count
        title: 有效区间数
        description: 质量为「有效」的计量区间个数。
        sql: "toInt64(sumIf({CUBE}.interval_count, {CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID'))"
        type: number

      - name: suspect_count
        title: 可疑区间数
        description: 质量为「可疑」的计量区间个数，例如读数跳变或计数器回绕附近。
        sql: "toInt64(sumIf({CUBE}.interval_count, {CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'SUSPECT'))"
        type: number

      - name: invalid_count
        title: 无效区间数
        description: 质量为「无效」的计量区间个数，这些区间不计入任何能耗。
        sql: "toInt64(sumIf({CUBE}.interval_count, {CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'INVALID'))"
        type: number

      - name: max_data_watermark
        title: 数据截至
        description: 参与计算的读数里最新的采样时间（UTC），之后的能耗还没有到。
        sql: data_watermark
        type: max
        filters:
          - sql: "{CUBE}.quality != 'MISSING'"

      - name: max_dataset_revision
        title: 数据版本
        description: 参与计算的区间里最大的数据版本号，数据重算后会变大。
        sql: dataset_revision
        type: max
        filters:
          - sql: "{CUBE}.quality != 'MISSING'"

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: energy_type
        title: 能源类型
        description: 用电量或供冷量，都以 kWh 计。
        sql: energy_type
        type: string

      - name: quality
        title: 数据质量
        description: 有效、可疑或无效。
        sql: quality
        type: string

      - name: period_end
        title: 区间结束
        description: 计量区间的结束时间；按小时、日、月汇总时，整个区间算在它结束的那个时段里。
        sql: period_end
        type: time

    # Every cube that extends this one sees only the caller's Tenant and Site. Cube combines these
    # row filters with the views' own policies, so the Tenant never has to be a view member.
    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]

  # The Site's total: physical SITE facts by default, or synthesized BRANCH sub-meters when
  # analytics.site_total_submeters_visible lists sub-meters for the Site (#798).
  - name: site_energy_facts
    extends: energy_facts
    public: false
    title: 站点总能耗
    description: 站点总表的能耗区间（或合成总表的各分表之和）以及跨缺口电量。
    sql: >
      SELECT u.tenant_id AS tenant_id, u.site_id AS site_id, u.energy_type AS energy_type,
             u.quality AS quality, u.load_device_id AS load_device_id, u.period_end AS period_end,
             u.energy_kwh AS energy_kwh, u.interval_count AS interval_count,
             u.data_watermark AS data_watermark, u.dataset_revision AS dataset_revision,
             u.is_cross_gap AS is_cross_gap, u.is_synthesized AS is_synthesized
      FROM (
        SELECT tenant_id, site_id, energy_type, quality, load_device_id, hour AS period_end,
               accounting_scope, point_id,
               energy_kwh, interval_count, data_watermark, dataset_revision,
               toUInt8(0) AS is_cross_gap,
               toUInt8(energy_type = 'electricity' AND accounting_scope = 'BRANCH') AS is_synthesized
        FROM analytics.energy_hourly_effective
        WHERE {FILTER_PARAMS.site_energy_facts.tenant_id.filter('tenant_id')}
          AND {FILTER_PARAMS.site_energy_facts.site_id.filter('site_id')}
          AND {FILTER_PARAMS.site_energy_facts.energy_type.filter('energy_type')}
          AND {FILTER_PARAMS.site_energy_facts.quality.filter('quality')}
          AND {FILTER_PARAMS.site_energy_facts.period_end.filter('hour')}
          AND {FILTER_PARAMS.site_energy_facts.period_end.filter('addSeconds(hour, 3599)')}
        UNION ALL
        SELECT e.tenant_id AS tenant_id, e.site_id AS site_id, e.energy_type AS energy_type,
               e.quality AS quality, e.load_device_id AS load_device_id,
               addMilliseconds(e.period_end, -1) AS period_end,
               e.accounting_scope AS accounting_scope, e.point_id AS point_id,
               e.energy_kwh AS energy_kwh, toInt64(1) AS interval_count,
               e.data_watermark AS data_watermark, e.dataset_revision AS dataset_revision,
               toUInt8(0) AS is_cross_gap,
               toUInt8(e.energy_type = 'electricity' AND e.accounting_scope = 'BRANCH') AS is_synthesized
        FROM analytics.energy_interval_facts_cube AS e
        WHERE dateDiff('millisecond', e.period_start, e.period_end) <= 3600000
          AND {FILTER_PARAMS.site_energy_facts.tenant_id.filter('e.tenant_id')}
          AND {FILTER_PARAMS.site_energy_facts.site_id.filter('e.site_id')}
          AND {FILTER_PARAMS.site_energy_facts.energy_type.filter('e.energy_type')}
          AND {FILTER_PARAMS.site_energy_facts.quality.filter('e.quality')}
          AND {FILTER_PARAMS.site_energy_facts.period_end.filter('addMilliseconds(e.period_end, -1)')}
          AND {FILTER_PARAMS.site_energy_facts.period_end.filter(lambda f, t: f"((e.period_end >= addMilliseconds(parseDateTime64BestEffort({f}, 3, 'UTC'), 1) AND e.period_end <= if(toDateTime64(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 3, 'UTC') < parseDateTime64BestEffort({f}, 3, 'UTC'), toDateTime64(addHours(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 1), 3, 'UTC'), toDateTime64(0, 3, 'UTC'))) OR (e.period_end > toDateTime64(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3, 'UTC') AND e.period_end <= if(toDateTime64(addSeconds(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3599), 3, 'UTC') > parseDateTime64BestEffort({t}, 3, 'UTC'), addMilliseconds(parseDateTime64BestEffort({t}, 3, 'UTC'), 1), toDateTime64(0, 3, 'UTC'))))")}
          AND NOT ({FILTER_PARAMS.site_energy_facts.period_end.filter('toStartOfHour(addMilliseconds(e.period_end, -1))')}
            AND {FILTER_PARAMS.site_energy_facts.period_end.filter('addSeconds(toStartOfHour(addMilliseconds(e.period_end, -1)), 3599)')})
        UNION ALL
        SELECT g.tenant_id AS tenant_id, g.site_id AS site_id, g.energy_type AS energy_type,
               g.quality AS quality, g.load_device_id AS load_device_id,
               addMilliseconds(g.period_end, -1) AS period_end,
               g.accounting_scope AS accounting_scope, g.point_id AS point_id,
               g.energy_kwh AS energy_kwh, toInt64(0) AS interval_count,
               g.data_watermark AS data_watermark, g.dataset_revision AS dataset_revision,
               toUInt8(1) AS is_cross_gap,
               toUInt8(g.energy_type = 'electricity' AND g.accounting_scope = 'BRANCH') AS is_synthesized
        FROM analytics.energy_cross_gap_facts_visible AS g
        WHERE {FILTER_PARAMS.site_energy_facts.tenant_id.filter('g.tenant_id')}
          AND {FILTER_PARAMS.site_energy_facts.site_id.filter('g.site_id')}
          AND {FILTER_PARAMS.site_energy_facts.energy_type.filter('g.energy_type')}
          AND {FILTER_PARAMS.site_energy_facts.quality.filter('g.quality')}
          AND {FILTER_PARAMS.site_energy_facts.period_end.filter('addMilliseconds(g.period_end, -1)')}
      ) AS u
      WHERE (
        (u.energy_type != 'electricity' AND u.accounting_scope = 'SITE')
        OR (u.energy_type = 'electricity' AND u.accounting_scope = 'SITE'
          AND (u.tenant_id, u.site_id) NOT IN (SELECT tenant_id, site_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_facts.site_id.filter('site_id')}))
        OR (u.energy_type = 'electricity' AND u.accounting_scope = 'BRANCH'
          AND (u.tenant_id, u.site_id, u.point_id) IN (SELECT tenant_id, site_id, point_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_facts.site_id.filter('site_id')}))
      )

    measures:
      - name: electricity_valid_kwh
        title: 用电量
        description: 站点总表的用电量（有效数据，不含跨缺口电量），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_type = 'electricity'"

      - name: cooling_valid_kwh
        title: 供冷量
        description: 站点的供冷量（有效数据，不含跨缺口冷量），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_type = 'cooling'"

      - name: cop
        title: 综合能效
        description: 同一时段的供冷量 ÷ 用电量（COP），两者都只算有效数据；没有用电量的时段为空。不要再按能源类型筛选，否则分子或分母为空。
        sql: "{cooling_valid_kwh} / NULLIF({electricity_valid_kwh}, 0)"
        type: number

      - name: synthesized_total
        title: 合成总表标记
        description: 站点总表由各分表合成时为 1，物理总表为 0。
        sql: is_synthesized
        type: max

  # Missing sub-meters for synthesized Site electricity (#798): queried only when synthesized_total = 1
  # so regular site_energy series/metadata queries avoid sub-meter join compilation and execution.
  - name: site_energy_missing_facts
    public: false
    title: 站点缺失分表
    description: 合成总表站点在时段内缺少有效读数的分表记录。
    sql: >
      SELECT h.tenant_id AS tenant_id,
             h.site_id AS site_id,
             CAST('electricity', 'LowCardinality(String)') AS energy_type,
             h.sample_period_end AS period_end,
             sub.meter_name AS missing_meter
      FROM (
        SELECT tenant_id, site_id, hour AS sample_period_end,
               groupUniqArrayIf(point_id, quality = 'VALID') AS valid_points
        FROM analytics.energy_hourly_effective
        WHERE accounting_scope = 'BRANCH' AND energy_type = 'electricity'
          AND {FILTER_PARAMS.site_energy_missing_facts.tenant_id.filter('tenant_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.site_id.filter('site_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.energy_type.filter("'electricity'")}
          AND {FILTER_PARAMS.site_energy_missing_facts.period_end.filter('hour')}
          AND {FILTER_PARAMS.site_energy_missing_facts.period_end.filter('addSeconds(hour, 3599)')}
          AND (tenant_id, site_id, point_id) IN (SELECT tenant_id, site_id, point_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_missing_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_missing_facts.site_id.filter('site_id')})
        GROUP BY tenant_id, site_id, hour
        HAVING notEmpty(valid_points)
        UNION ALL
        SELECT e.tenant_id AS tenant_id, e.site_id AS site_id,
               max(addMilliseconds(e.period_end, -1)) AS sample_period_end,
               groupUniqArrayIf(e.point_id, e.quality = 'VALID') AS valid_points
        FROM analytics.energy_interval_facts_cube AS e
        WHERE e.accounting_scope = 'BRANCH' AND e.energy_type = 'electricity'
          AND dateDiff('millisecond', e.period_start, e.period_end) <= 3600000
          AND {FILTER_PARAMS.site_energy_missing_facts.tenant_id.filter('e.tenant_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.site_id.filter('e.site_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.energy_type.filter("'electricity'")}
          AND {FILTER_PARAMS.site_energy_missing_facts.period_end.filter('addMilliseconds(e.period_end, -1)')}
          AND {FILTER_PARAMS.site_energy_missing_facts.period_end.filter(lambda f, t: f"((e.period_end >= addMilliseconds(parseDateTime64BestEffort({f}, 3, 'UTC'), 1) AND e.period_end <= if(toDateTime64(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 3, 'UTC') < parseDateTime64BestEffort({f}, 3, 'UTC'), toDateTime64(addHours(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 1), 3, 'UTC'), toDateTime64(0, 3, 'UTC'))) OR (e.period_end > toDateTime64(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3, 'UTC') AND e.period_end <= if(toDateTime64(addSeconds(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3599), 3, 'UTC') > parseDateTime64BestEffort({t}, 3, 'UTC'), addMilliseconds(parseDateTime64BestEffort({t}, 3, 'UTC'), 1), toDateTime64(0, 3, 'UTC'))))")}
          AND NOT ({FILTER_PARAMS.site_energy_missing_facts.period_end.filter('toStartOfHour(addMilliseconds(e.period_end, -1))')}
            AND {FILTER_PARAMS.site_energy_missing_facts.period_end.filter('addSeconds(toStartOfHour(addMilliseconds(e.period_end, -1)), 3599)')})
          AND (e.tenant_id, e.site_id, e.point_id) IN (SELECT tenant_id, site_id, point_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_missing_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_missing_facts.site_id.filter('site_id')})
        GROUP BY e.tenant_id, e.site_id, toStartOfHour(addMilliseconds(e.period_end, -1))
        HAVING notEmpty(valid_points)
      ) AS h
      INNER JOIN (
        SELECT tenant_id, site_id, point_id, meter_name
        FROM analytics.site_total_submeters_visible
        WHERE {FILTER_PARAMS.site_energy_missing_facts.tenant_id.filter('tenant_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.site_id.filter('site_id')}
          AND {FILTER_PARAMS.site_energy_missing_facts.energy_type.filter("'electricity'")}
      ) AS sub
        ON h.tenant_id = sub.tenant_id AND h.site_id = sub.site_id
      WHERE NOT has(h.valid_points, sub.point_id)

    measures:
      - name: missing_count
        title: 缺失分表数
        description: 合成总表站点在时段内缺少有效读数的分表记录条数。
        sql: "toInt64(count())"
        type: number

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: energy_type
        title: 能源类型
        description: 用电量或供冷量，都以 kWh 计。
        sql: energy_type
        type: string

      - name: missing_meter
        title: 缺失分表
        description: 合成总表站点在该小时缺少有效读数的分表名称；完整小时为空字符串。
        sql: missing_meter
        type: string

      - name: period_end
        title: 时段
        description: 缺失分表对应的统计时间。
        sql: period_end
        type: time

    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]

  # Equipment sub-meters: BRANCH facts, already inside the Site's total.
  - name: equipment_energy_facts
    extends: energy_facts
    public: false
    title: 设备分项能耗
    description: 各设备分表的能耗区间；这些能耗已经包含在站点总表里，不能再与总表相加。
    sql: >
      SELECT tenant_id, site_id, energy_type, quality, load_device_id, hour AS period_end,
             energy_kwh, interval_count, data_watermark, dataset_revision, toUInt8(0) AS is_cross_gap
      FROM analytics.energy_hourly_effective
      WHERE accounting_scope = 'BRANCH'
        AND {FILTER_PARAMS.equipment_energy_facts.tenant_id.filter('tenant_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.site_id.filter('site_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.energy_type.filter('energy_type')}
        AND {FILTER_PARAMS.equipment_energy_facts.quality.filter('quality')}
        AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter('hour')}
        AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter('addSeconds(hour, 3599)')}
      UNION ALL
      SELECT e.tenant_id AS tenant_id, e.site_id AS site_id, e.energy_type AS energy_type,
             e.quality AS quality, e.load_device_id AS load_device_id,
             addMilliseconds(e.period_end, -1) AS period_end,
             e.energy_kwh AS energy_kwh, toInt64(1) AS interval_count,
             e.data_watermark AS data_watermark, e.dataset_revision AS dataset_revision,
             toUInt8(0) AS is_cross_gap
      FROM analytics.energy_interval_facts_cube AS e
      WHERE e.accounting_scope = 'BRANCH'
        AND dateDiff('millisecond', e.period_start, e.period_end) <= 3600000
        AND {FILTER_PARAMS.equipment_energy_facts.tenant_id.filter('e.tenant_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.site_id.filter('e.site_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.energy_type.filter('e.energy_type')}
        AND {FILTER_PARAMS.equipment_energy_facts.quality.filter('e.quality')}
        AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter('addMilliseconds(e.period_end, -1)')}
        AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter(lambda f, t: f"((e.period_end >= addMilliseconds(parseDateTime64BestEffort({f}, 3, 'UTC'), 1) AND e.period_end <= if(toDateTime64(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 3, 'UTC') < parseDateTime64BestEffort({f}, 3, 'UTC'), toDateTime64(addHours(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 1), 3, 'UTC'), toDateTime64(0, 3, 'UTC'))) OR (e.period_end > toDateTime64(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3, 'UTC') AND e.period_end <= if(toDateTime64(addSeconds(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3599), 3, 'UTC') > parseDateTime64BestEffort({t}, 3, 'UTC'), addMilliseconds(parseDateTime64BestEffort({t}, 3, 'UTC'), 1), toDateTime64(0, 3, 'UTC'))))")}
        AND NOT ({FILTER_PARAMS.equipment_energy_facts.period_end.filter('toStartOfHour(addMilliseconds(e.period_end, -1))')}
          AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter('addSeconds(toStartOfHour(addMilliseconds(e.period_end, -1)), 3599)')})
      UNION ALL
      SELECT g.tenant_id AS tenant_id, g.site_id AS site_id, g.energy_type AS energy_type,
             g.quality AS quality, g.load_device_id AS load_device_id,
             addMilliseconds(g.period_end, -1) AS period_end,
             g.energy_kwh AS energy_kwh, toInt64(0) AS interval_count,
             g.data_watermark AS data_watermark, g.dataset_revision AS dataset_revision,
             toUInt8(1) AS is_cross_gap
      FROM analytics.energy_cross_gap_facts_visible AS g
      WHERE g.accounting_scope = 'BRANCH'
        AND {FILTER_PARAMS.equipment_energy_facts.tenant_id.filter('g.tenant_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.site_id.filter('g.site_id')}
        AND {FILTER_PARAMS.equipment_energy_facts.energy_type.filter('g.energy_type')}
        AND {FILTER_PARAMS.equipment_energy_facts.quality.filter('g.quality')}
        AND {FILTER_PARAMS.equipment_energy_facts.period_end.filter('addMilliseconds(g.period_end, -1)')}

    dimensions:
      - name: equipment_id
        title: 设备
        description: 分表所计量的设备，结果里显示设备名称。
        sql: load_device_id
        type: string

  # The Site's electricity priced at its import Tariff (#575). Each fact takes the rate of the
  # price window containing addMilliseconds(period_end, -1) under Option A (period_start, period_end],
  # the same instant that decides its bucket; a fact outside every window has no rate and counts as
  # unpriced. Synthesized Sites read their sub-meters from analytics.site_total_submeters_visible
  # without double-counting historical SITE rows (#798).
  - name: site_energy_cost_facts
    public: false
    title: 站点电费估算
    description: 站点总表的用电区间，按区间结束时刻所在的电价时段计价。
    sql: >
      SELECT fact.tenant_id AS tenant_id, fact.site_id AS site_id, fact.period_end AS period_end,
             fact.quality AS quality, fact.energy_kwh AS energy_kwh, fact.is_cross_gap AS is_cross_gap,
             if(price.window_end > price.window_start AND fact.period_end >= price.window_start AND fact.period_end < price.window_end, price.period_code, '') AS tariff_period,
             if(price.window_end > price.window_start AND fact.period_end >= price.window_start AND fact.period_end < price.window_end, price.energy_rate_per_kwh, NULL) AS energy_rate_per_kwh
      FROM (
        SELECT raw_fact.tenant_id AS tenant_id, raw_fact.site_id AS site_id, raw_fact.period_end AS period_end,
               raw_fact.quality AS quality, raw_fact.energy_kwh AS energy_kwh, raw_fact.is_cross_gap AS is_cross_gap
        FROM (
          SELECT tenant_id, site_id, hour AS period_end, quality, energy_kwh, toUInt8(0) AS is_cross_gap,
                 accounting_scope, point_id
          FROM analytics.energy_hourly_effective
          WHERE energy_type = 'electricity'
            AND {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('hour')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addSeconds(hour, 3599)')}
            AND (tenant_id, site_id, hour) NOT IN (
              SELECT tenant_id, site_id, assumeNotNull(split_hour) AS split_hour
              FROM (
                SELECT tenant_id, site_id,
                       arrayJoin([
                         if(window_start != toStartOfHour(window_start), toNullable(toDateTime64(toStartOfHour(window_start), 3, 'UTC')), NULL),
                         if(window_end != toStartOfHour(window_end), toNullable(toDateTime64(toStartOfHour(window_end), 3, 'UTC')), NULL)
                       ]) AS split_hour
                FROM analytics.tariff_price_windows_visible
                WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')}
                  AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
                  AND (window_start != toStartOfHour(window_start) OR window_end != toStartOfHour(window_end))
              )
              WHERE split_hour IS NOT NULL
            )
          UNION ALL
          SELECT e.tenant_id AS tenant_id, e.site_id AS site_id, addMilliseconds(e.period_end, -1) AS period_end,
                 e.quality AS quality, e.energy_kwh AS energy_kwh, toUInt8(0) AS is_cross_gap,
                 e.accounting_scope AS accounting_scope, e.point_id AS point_id
          FROM analytics.energy_interval_facts_cube AS e
          WHERE e.energy_type = 'electricity'
            AND dateDiff('millisecond', e.period_start, e.period_end) <= 3600000
            AND {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('e.tenant_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('e.site_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addMilliseconds(e.period_end, -1)')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter(lambda f, t: f"((e.period_end >= addMilliseconds(parseDateTime64BestEffort({f}, 3, 'UTC'), 1) AND e.period_end <= if(toDateTime64(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 3, 'UTC') < parseDateTime64BestEffort({f}, 3, 'UTC'), toDateTime64(addHours(toStartOfHour(parseDateTime64BestEffort({f}, 3, 'UTC')), 1), 3, 'UTC'), toDateTime64(0, 3, 'UTC'))) OR (e.period_end > toDateTime64(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3, 'UTC') AND e.period_end <= if(toDateTime64(addSeconds(toStartOfHour(parseDateTime64BestEffort({t}, 3, 'UTC')), 3599), 3, 'UTC') > parseDateTime64BestEffort({t}, 3, 'UTC'), addMilliseconds(parseDateTime64BestEffort({t}, 3, 'UTC'), 1), toDateTime64(0, 3, 'UTC'))))")}
            AND NOT ({FILTER_PARAMS.site_energy_cost_facts.period_end.filter('toStartOfHour(addMilliseconds(e.period_end, -1))')}
              AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addSeconds(toStartOfHour(addMilliseconds(e.period_end, -1)), 3599)')})
          UNION ALL
          SELECT e.tenant_id AS tenant_id, e.site_id AS site_id, addMilliseconds(e.period_end, -1) AS period_end,
                 e.quality AS quality, e.energy_kwh AS energy_kwh, toUInt8(0) AS is_cross_gap,
                 e.accounting_scope AS accounting_scope, e.point_id AS point_id
          FROM analytics.energy_interval_facts_cube AS e
          WHERE e.energy_type = 'electricity'
            AND dateDiff('millisecond', e.period_start, e.period_end) <= 3600000
            AND {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('e.tenant_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('e.site_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addMilliseconds(e.period_end, -1)')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('toStartOfHour(addMilliseconds(e.period_end, -1))')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addSeconds(toStartOfHour(addMilliseconds(e.period_end, -1)), 3599)')}
            AND e.period_end <= (
              SELECT if(
                countIf(window_start != toStartOfHour(window_start) OR window_end != toStartOfHour(window_end)) > 0,
                greatest(
                  maxIf(addHours(toDateTime64(toStartOfHour(window_start), 3, 'UTC'), 1), window_start != toStartOfHour(window_start)),
                  maxIf(addHours(toDateTime64(toStartOfHour(window_end), 3, 'UTC'), 1), window_end != toStartOfHour(window_end))
                ),
                toDateTime64(0, 3, 'UTC')
              )
              FROM analytics.tariff_price_windows_visible
              WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')}
                AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
            )
            AND (e.tenant_id, e.site_id, toDateTime64(toStartOfHour(addMilliseconds(e.period_end, -1)), 3, 'UTC')) IN (
              SELECT tenant_id, site_id, assumeNotNull(split_hour) AS split_hour
              FROM (
                SELECT tenant_id, site_id,
                       arrayJoin([
                         if(window_start != toStartOfHour(window_start), toNullable(toDateTime64(toStartOfHour(window_start), 3, 'UTC')), NULL),
                         if(window_end != toStartOfHour(window_end), toNullable(toDateTime64(toStartOfHour(window_end), 3, 'UTC')), NULL)
                       ]) AS split_hour
                FROM analytics.tariff_price_windows_visible
                WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')}
                  AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
                  AND (window_start != toStartOfHour(window_start) OR window_end != toStartOfHour(window_end))
              )
              WHERE split_hour IS NOT NULL
            )
          UNION ALL
          SELECT g.tenant_id AS tenant_id, g.site_id AS site_id, addMilliseconds(g.period_end, -1) AS period_end,
                 g.quality AS quality, g.energy_kwh AS energy_kwh, toUInt8(1) AS is_cross_gap,
                 g.accounting_scope AS accounting_scope, g.point_id AS point_id
          FROM analytics.energy_cross_gap_facts_visible AS g
          WHERE g.energy_type = 'electricity'
            AND {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('g.tenant_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('g.site_id')}
            AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('addMilliseconds(g.period_end, -1)')}
        ) AS raw_fact
        WHERE (
          (raw_fact.accounting_scope = 'SITE'
            AND (raw_fact.tenant_id, raw_fact.site_id) NOT IN (SELECT tenant_id, site_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}))
          OR (raw_fact.accounting_scope = 'BRANCH'
            AND (raw_fact.tenant_id, raw_fact.site_id, raw_fact.point_id) IN (SELECT tenant_id, site_id, point_id FROM analytics.site_total_submeters_visible WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')} AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}))
        )
      ) AS fact
      ASOF LEFT JOIN (
        SELECT tenant_id, site_id, window_start, window_end, period_code, energy_rate_per_kwh
        FROM analytics.tariff_price_windows_visible
        WHERE {FILTER_PARAMS.site_energy_cost_facts.tenant_id.filter('tenant_id')}
          AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
      ) AS price
        ON fact.tenant_id = price.tenant_id AND fact.site_id = price.site_id AND fact.period_end >= price.window_start

    measures:
      - name: cost_valid_cny
        title: 电度电费（有效数据）
        description: 有效用电量按电价时段计价的估算电度电费（不含跨缺口电量），单位元；不含需量电费，实际账单以结算为准。没有电价的电量不计入，见「未计价电量」。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID'"

      - name: cost_valid_and_suspect_cny
        title: 电度电费（含可疑数据）
        description: 有效和可疑用电量的估算电度电费（不含跨缺口电量），单位元；可疑数据较多时用来估算上限。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: priced_valid_kwh
        title: 已计价电量（有效数据）
        description: 有电价覆盖的有效用电量（不含跨缺口电量），单位 kWh；按电价时段拆分时就是各时段的用电量。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: priced_valid_and_suspect_kwh
        title: 已计价电量（含可疑数据）
        description: 有电价覆盖的有效和可疑用电量（不含跨缺口电量），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: unpriced_valid_kwh
        title: 未计价电量（有效数据）
        description: 没有任何电价时段覆盖的有效用电量（不含跨缺口电量），单位 kWh，例如站点还没有分配购电电价；这部分电费是未知，不是零。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NULL"

      - name: unpriced_valid_and_suspect_kwh
        title: 未计价电量（含可疑数据）
        description: 没有电价覆盖的有效和可疑用电量（不含跨缺口电量），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 0 AND {CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NULL"

      - name: cross_gap_cost_valid_cny
        title: 跨缺口电度电费（有效数据）
        description: 跨缺口有效用电量按恢复读数时刻电价时段计价的估算电度电费，单位元。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality = 'VALID'"

      - name: cross_gap_cost_valid_and_suspect_cny
        title: 跨缺口电度电费（含可疑数据）
        description: 跨缺口有效与可疑用电量的估算电度电费，单位元。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: cross_gap_priced_valid_kwh
        title: 跨缺口已计价电量（有效数据）
        description: 有电价覆盖的跨缺口有效用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: cross_gap_priced_valid_and_suspect_kwh
        title: 跨缺口已计价电量（含可疑数据）
        description: 有电价覆盖的跨缺口有效与可疑用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: cross_gap_unpriced_valid_kwh
        title: 跨缺口未计价电量（有效数据）
        description: 没有电价时段覆盖的跨缺口有效用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NULL"

      - name: cross_gap_unpriced_valid_and_suspect_kwh
        title: 跨缺口未计价电量（含可疑数据）
        description: 没有电价覆盖的跨缺口有效与可疑用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.is_cross_gap = 1 AND {CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NULL"

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: tariff_period
        title: 电价时段
        description: 尖峰、峰、平或谷；没有电价的电量显示为未计价。
        sql: tariff_period
        type: string

      - name: period_end
        title: 区间结束
        description: 计量区间的结束时间；按小时、日、月汇总时，整个区间算在它结束的那个时段里，电价也按这个时刻取。
        sql: period_end
        type: time

    # The same row policy as energy_facts: only the caller's Tenant and Site.
    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]

  - name: site_meter_balance_facts
    public: false
    title: 站点主分表平衡
    description: 站点物理总表与设备分表用电量的小时级对比结果与偏差状态。
    sql: >
      SELECT tenant_id, site_id, hour, site_kwh, submeter_sum_kwh, diff_kwh, imbalance_status
      FROM analytics.site_meter_balance_hourly

    measures:
      - name: site_kwh
        title: 站点总表用电量
        description: 站点物理总表在所选时段内的有效用电量之和，单位 kWh。
        sql: site_kwh
        type: sum

      - name: submeter_sum_kwh
        title: 分表用电量之和
        description: 各设备分表在所选时段内的有效用电量之和，单位 kWh。
        sql: submeter_sum_kwh
        type: sum

      - name: diff_kwh
        title: 主分表电量差额
        description: 站点总表用电量减去各分表用电量之和的差额，单位 kWh；正值表示有未分表覆盖的用电，负值表示分表之和大于总表。
        sql: diff_kwh
        type: sum

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: imbalance_status
        title: 平衡状态
        description: 总表与分表用电量对比的状态分类，例如平衡、存在未计量缺口、分表之和大于总表或缺少总表。
        sql: imbalance_status
        type: string

      - name: period_end
        title: 统计时段
        description: 按小时对齐的统计时刻；按小时、日、月汇总时归入该时段。
        sql: hour
        type: time

    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]

  - name: thermal_cop_asof_facts
    public: false
    title: 瞬时能效对齐审计
    description: 将瞬时制冷功率与最邻近时刻的用电功率对齐后的瞬时功率与能效数据。
    sql: >
      SELECT tenant_id, site_id, thermal_sampled_at, thermal_kw, electrical_kw, instant_cop
      FROM analytics.thermal_cop_asof_audit

    measures:
      - name: thermal_kw
        title: 平均制冷功率
        description: 所选时段内对齐样本的平均瞬时制冷功率，单位 kW。
        sql: thermal_kw
        type: avg

      - name: electrical_kw
        title: 平均用电功率
        description: 所选时段内对齐样本的平均瞬时用电功率，单位 kW。
        sql: electrical_kw
        type: avg

      - name: asof_cop
        title: 对齐瞬时能效
        description: 有效对齐样本的制冷总功率除以用电总功率得到的能效比（COP）；没有有效对齐样本时为空。
        sql: "if(sumIf({CUBE}.electrical_kw, {CUBE}.instant_cop IS NOT NULL) > 0, sumIf({CUBE}.thermal_kw, {CUBE}.instant_cop IS NOT NULL) / sumIf({CUBE}.electrical_kw, {CUBE}.instant_cop IS NOT NULL), NULL)"
        type: number

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: period_end
        title: 采样时刻
        description: 瞬时制冷功率的采样时间；按小时、日、月汇总时归入该时段。
        sql: thermal_sampled_at
        type: time

    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]
