# Internal cubes over the projected energy facts. Nothing queries them directly: the views in
# ../views are the public surface (ADR 0023). Titles and descriptions are Chinese because the
# views carry them to operators and to the Operations Agent.

cubes:
  - name: energy_facts
    public: false
    title: 能耗区间
    description: 电表累计读数投影成的可相加能耗区间，带质量、数据截至时间和数据版本。
    sql: SELECT * FROM analytics.energy_interval_facts_visible

    measures:
      - name: energy_valid_kwh
        title: 能耗（有效数据）
        description: 只算质量判定为「有效」的读数，单位 kWh。必须同时按能源类型筛选，否则会把用电量和供冷量加在一起。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID'"

      - name: energy_valid_and_suspect_kwh
        title: 能耗（含可疑数据）
        description: 包括质量为「有效」和「可疑」的读数，单位 kWh；可疑读数较多时用来估算上限。同样必须按能源类型筛选。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: valid_count
        title: 有效区间数
        description: 质量为「有效」的计量区间个数。
        type: count
        filters:
          - sql: "{CUBE}.quality = 'VALID'"

      - name: suspect_count
        title: 可疑区间数
        description: 质量为「可疑」的计量区间个数，例如读数跳变或计数器回绕附近。
        type: count
        filters:
          - sql: "{CUBE}.quality = 'SUSPECT'"

      - name: invalid_count
        title: 无效区间数
        description: 质量为「无效」的计量区间个数，这些区间不计入任何能耗。
        type: count
        filters:
          - sql: "{CUBE}.quality = 'INVALID'"

      - name: max_data_watermark
        title: 数据截至
        description: 参与计算的读数里最新的采样时间（UTC），之后的能耗还没有到。
        sql: data_watermark
        type: max

      - name: max_dataset_revision
        title: 数据版本
        description: 参与计算的区间里最大的数据版本号，数据重算后会变大。
        sql: dataset_revision
        type: max

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: energy_type
        title: 能源类型
        description: 用电量或供冷量，都以 kWh 计。
        sql: energy_type
        type: string

      - name: quality
        title: 数据质量
        description: 有效、可疑或无效。
        sql: quality
        type: string

      - name: period_start
        title: 区间开始
        description: 计量区间的开始时间。
        sql: period_start
        type: time

      - name: period_end
        title: 区间结束
        description: 计量区间的结束时间；按小时、日、月汇总时，整个区间算在它结束的那个时段里。
        sql: period_end
        type: time

    # Every cube that extends this one sees only the caller's Tenant and Site. Cube combines these
    # row filters with the views' own policies, so the Tenant never has to be a view member.
    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]

  # The Site's total: SITE facts only.
  - name: site_energy_facts
    extends: energy_facts
    public: false
    title: 站点总能耗
    description: 站点总表的能耗区间，不含已经算在总表里的设备分表。
    sql: SELECT * FROM analytics.energy_interval_facts_visible WHERE accounting_scope = 'SITE'

    measures:
      - name: electricity_valid_kwh
        title: 用电量
        description: 站点总表的用电量（有效数据），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID' AND {CUBE}.energy_type = 'electricity'"

      - name: cooling_valid_kwh
        title: 供冷量
        description: 站点的供冷量（有效数据），单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID' AND {CUBE}.energy_type = 'cooling'"

      - name: cop
        title: 综合能效
        description: 同一时段的供冷量 ÷ 用电量（COP），两者都只算有效数据；没有用电量的时段为空。不要再按能源类型筛选，否则分子或分母为空。
        sql: "{cooling_valid_kwh} / NULLIF({electricity_valid_kwh}, 0)"
        type: number

  # Equipment sub-meters: BRANCH facts, already inside the Site's total.
  - name: equipment_energy_facts
    extends: energy_facts
    public: false
    title: 设备分项能耗
    description: 各设备分表的能耗区间；这些能耗已经包含在站点总表里，不能再与总表相加。
    sql: SELECT * FROM analytics.energy_interval_facts_visible WHERE accounting_scope = 'BRANCH'

    dimensions:
      - name: equipment_id
        title: 设备
        description: 分表所计量的设备，结果里显示设备名称。
        sql: load_device_id
        type: string

  # The Site's electricity priced at its import Tariff (#575). Each fact takes the rate of the
  # price window its period ends in, the instant that also decides its bucket; a fact outside
  # every window has no rate and counts as unpriced. Both sides are cut to the queried Site first,
  # and the facts to the queried time; the windows are not, since a fact needs the one before it.
  - name: site_energy_cost_facts
    public: false
    title: 站点电费估算
    description: 站点总表的用电区间，按区间结束时刻所在的电价时段计价。
    sql: >
      SELECT fact.tenant_id AS tenant_id, fact.site_id AS site_id, fact.period_end AS period_end,
             fact.quality AS quality, fact.energy_kwh AS energy_kwh,
             if(fact.period_end < price.window_end, price.period_code, '') AS tariff_period,
             if(fact.period_end < price.window_end, price.energy_rate_per_kwh, NULL) AS energy_rate_per_kwh
      FROM (
        SELECT tenant_id, site_id, period_end, quality, energy_kwh
        FROM analytics.energy_interval_facts_visible
        WHERE accounting_scope = 'SITE' AND energy_type = 'electricity'
          AND {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
          AND {FILTER_PARAMS.site_energy_cost_facts.period_end.filter('period_end')}
      ) AS fact
      ASOF LEFT JOIN (
        SELECT tenant_id, site_id, window_start, window_end, period_code, energy_rate_per_kwh
        FROM analytics.tariff_price_windows_visible
        WHERE {FILTER_PARAMS.site_energy_cost_facts.site_id.filter('site_id')}
      ) AS price
        ON fact.tenant_id = price.tenant_id AND fact.site_id = price.site_id AND fact.period_end >= price.window_start

    measures:
      - name: cost_valid_cny
        title: 电度电费（有效数据）
        description: 有效用电量按电价时段计价的估算电度电费，单位元；不含需量电费，实际账单以结算为准。没有电价的电量不计入，见「未计价电量」。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID'"

      - name: cost_valid_and_suspect_cny
        title: 电度电费（含可疑数据）
        description: 有效和可疑用电量的估算电度电费，单位元；可疑数据较多时用来估算上限。
        sql: "{CUBE}.energy_kwh * {CUBE}.energy_rate_per_kwh"
        type: sum
        filters:
          - sql: "{CUBE}.quality IN ('VALID', 'SUSPECT')"

      - name: priced_valid_kwh
        title: 已计价电量（有效数据）
        description: 有电价覆盖的有效用电量，单位 kWh；按电价时段拆分时就是各时段的用电量。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: priced_valid_and_suspect_kwh
        title: 已计价电量（含可疑数据）
        description: 有电价覆盖的有效和可疑用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NOT NULL"

      - name: unpriced_valid_kwh
        title: 未计价电量（有效数据）
        description: 没有任何电价时段覆盖的有效用电量，单位 kWh，例如站点还没有分配购电电价；这部分电费是未知，不是零。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality = 'VALID' AND {CUBE}.energy_rate_per_kwh IS NULL"

      - name: unpriced_valid_and_suspect_kwh
        title: 未计价电量（含可疑数据）
        description: 没有电价覆盖的有效和可疑用电量，单位 kWh。
        sql: energy_kwh
        type: sum
        filters:
          - sql: "{CUBE}.quality IN ('VALID', 'SUSPECT') AND {CUBE}.energy_rate_per_kwh IS NULL"

    dimensions:
      - name: tenant_id
        title: 租户
        description: 数据所属租户的编号，用于访问控制。
        sql: tenant_id
        type: string

      - name: site_id
        title: 站点
        description: 站点编号；每个查询只能看到被授权的站点。
        sql: site_id
        type: string

      - name: tariff_period
        title: 电价时段
        description: 尖峰、峰、平或谷；没有电价的电量显示为未计价。
        sql: tariff_period
        type: string

      - name: period_end
        title: 区间结束
        description: 计量区间的结束时间；按小时、日、月汇总时，整个区间算在它结束的那个时段里，电价也按这个时刻取。
        sql: period_end
        type: time

    # The same row policy as energy_facts: only the caller's Tenant and Site.
    access_policy:
      - group: analytics_reader
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: tenant_id
              operator: equals
              values: ["{ securityContext.tenantId }"]
            - member: site_id
              operator: equals
              values: ["{ securityContext.siteId }"]
